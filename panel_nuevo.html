<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TPV - Mi Barrio</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <meta name="robots" content="noindex, nofollow">

    <!-- ===== Optimización responsive PC / tablet / móvil ===== -->
    <style>
        /* El panel conserva la misma lógica y funciones; estos estilos solo reorganizan la interfaz. */
        html { scroll-behavior: smooth; }
        body { min-width: 320px; }

        /* Aprovechar el ancho disponible en escritorio */
        #header-panel > div,
        #header-panel > nav,
        #panel > main {
            max-width: 1800px !important;
        }

        #panel > main {
            width: 100%;
        }

        /* Los pedidos pasan a ser una grilla en pantallas grandes */
        #lista {
            display: grid;
            grid-template-columns: minmax(0, 1fr);
            gap: 14px;
            align-items: start;
        }

        #lista > article {
            min-width: 0;
            height: fit-content;
        }

        /* Evita que nombres largos rompan la tarjeta */
        #lista article [data-accion=toggle] {
            min-height: 52px;
        }

        /* Botones táctiles sin hacerlos enormes */
        button, a {
            -webkit-tap-highlight-color: transparent;
        }

        @media (min-width: 700px) {
            #lista {
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }
        }

        @media (min-width: 1100px) {
            #lista {
                grid-template-columns: repeat(3, minmax(0, 1fr));
            }
            #panel > main {
                padding-left: 20px !important;
                padding-right: 20px !important;
            }
        }

        @media (min-width: 1500px) {
            #lista {
                grid-template-columns: repeat(4, minmax(0, 1fr));
            }
        }

        /* Tablet horizontal: botones y cabecera mejor distribuidos */
        @media (min-width: 700px) and (max-width: 1099px) {
            #header-panel > div {
                padding-left: 20px !important;
                padding-right: 20px !important;
            }
            #header-panel > nav {
                padding-left: 20px !important;
                padding-right: 20px !important;
            }
        }

        /* Celular: mantener una sola columna y controles cómodos */
        @media (max-width: 699px) {
            #header-panel > div {
                flex-wrap: wrap;
            }
            #header-panel > div > div:last-child {
                width: 100%;
                overflow-x: auto;
                padding-bottom: 2px;
            }
            #header-panel > div > div:last-child button {
                flex-shrink: 0;
            }
            #lista {
                gap: 10px;
            }
            #panel > main {
                padding-top: 12px !important;
                padding-left: 10px !important;
                padding-right: 10px !important;
            }
        }

        /* En escritorio los pedidos pueden mostrar más información sin ocupar toda la pantalla. */
        @media (min-width: 1100px) {
            #lista article .text-xl {
                font-size: 1.15rem;
            }
            #lista article .px-4.pb-4.pt-3 {
                padding: 12px !important;
            }
        }

        /* Modales siguen centrados y limitados para no convertirse en formularios gigantes. */
        #modal-nuevo > div,
        #modal-caja > div {
            width: 100%;
        }

        /* Barra de filtros utilizable con mouse y dedo */
        #filtros {
            scrollbar-width: thin;
        }
        #filtros::-webkit-scrollbar { height: 5px; }

        /* Login centrado y cómodo en cualquier pantalla */
        #login form {
            box-sizing: border-box;
        }
    </style>
</head>
<body class="bg-neutral-100 text-neutral-800 antialiased">

    <!-- ===== Login ===== -->
    <section id="login" class="min-h-screen flex items-center justify-center px-4">
        <form id="form-login" class="w-full max-w-sm bg-white p-6 rounded-2xl shadow border border-neutral-200 space-y-4">
            <h1 class="text-xl font-extrabold text-red-700 text-center">🍕 TPV Mi Barrio</h1>
            <div>
                <label class="block text-xs font-semibold uppercase tracking-wider text-neutral-500 mb-1">Correo</label>
                <input id="email" type="email" required autocomplete="username" class="w-full bg-neutral-50 border border-neutral-300 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:border-red-500">
            </div>
            <div>
                <label class="block text-xs font-semibold uppercase tracking-wider text-neutral-500 mb-1">Contraseña</label>
                <input id="clave" type="password" required autocomplete="current-password" class="w-full bg-neutral-50 border border-neutral-300 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:border-red-500">
            </div>
            <p id="login-error" class="hidden text-sm text-red-700 bg-red-50 rounded-lg px-3 py-2"></p>
            <button type="submit" class="w-full bg-red-700 hover:bg-red-800 text-white font-bold py-3 rounded-xl transition">Entrar</button>
        </form>
    </section>

    <!-- ===== Panel ===== -->
    <section id="panel" class="hidden">
        <header id="header-panel" class="bg-red-700 text-white shadow sticky top-0 z-20">
            <div class="w-full max-w-[1800px] mx-auto px-4 py-3 flex items-center justify-between gap-2">
                <div>
                    <h1 id="titulo-panel" class="font-extrabold tracking-wide">🍕 Pedidos entrantes</h1>
                    <p id="contador" class="text-xs opacity-90">Cargando...</p>
                </div>
                <div class="flex items-center gap-2 flex-wrap justify-end">
                    <button id="btn-local" type="button" class="hidden text-xs font-extrabold px-3 py-1.5 rounded-lg" title="Abrir o cerrar el local">...</button>
                    <button id="btn-local-auto" type="button" class="hidden text-xs bg-white/20 hover:bg-white/30 font-bold px-2 py-1.5 rounded-lg" title="Volver al horario automático">↺ Auto</button>
                    <button id="btn-autoprint" type="button" class="hidden text-xs bg-white/20 hover:bg-white/30 font-bold px-3 py-1.5 rounded-lg" title="Imprimir la comanda sola en este equipo cuando entra un pedido nuevo">🖨️ Auto</button>
                    <button id="btn-agotados" type="button" class="hidden text-xs bg-white/20 hover:bg-white/30 font-bold px-3 py-1.5 rounded-lg" title="Marcar sabores agotados">🚫 Agotados</button>
                    <button id="btn-config" type="button" class="hidden text-xs bg-white/20 hover:bg-white/30 font-bold px-3 py-1.5 rounded-lg">⚙️ Config</button>
                    <button id="btn-cocina" type="button" class="hidden text-xs bg-white/20 hover:bg-white/30 font-bold px-3 py-1.5 rounded-lg">👨‍🍳 Cocina</button>
                    <button id="btn-rapida" type="button" class="hidden text-xs bg-amber-300 text-neutral-900 hover:bg-amber-200 font-bold px-3 py-1.5 rounded-lg">⚡ Venta rápida</button>
                    <button id="btn-nuevo" type="button" class="hidden text-xs bg-white text-red-700 hover:bg-red-50 font-bold px-3 py-1.5 rounded-lg">➕ Pedido</button>
                    <button id="btn-caja" type="button" class="hidden text-xs bg-white/20 hover:bg-white/30 font-bold px-3 py-1.5 rounded-lg">📊 Caja</button>
                    <button id="btn-sonido" type="button" class="text-xs bg-white/20 hover:bg-white/30 font-bold px-3 py-1.5 rounded-lg">🔔 Sonido</button>
                    <button id="btn-salir" type="button" class="text-xs bg-white/20 hover:bg-white/30 font-bold px-3 py-1.5 rounded-lg">Salir</button>
                </div>
            </div>
            <!-- Filtros por estado (se ocultan si es delivery) -->
            <nav id="filtros" class="w-full max-w-[1800px] mx-auto px-4 pb-3 flex gap-2 overflow-x-auto whitespace-nowrap"></nav>
        </header>

        <main class="w-full max-w-[1800px] mx-auto px-4 py-5 space-y-4">
            <button id="aviso-sonido" type="button" class="hidden w-full text-sm font-bold text-amber-900 bg-amber-100 border border-amber-300 rounded-xl px-4 py-3">
                🔕 Tocá acá para activar el aviso sonoro de pedidos nuevos
            </button>
            <p id="aviso-error" class="hidden text-sm text-red-700 bg-red-50 border border-red-200 rounded-xl px-4 py-3"></p>
            <div id="lista"></div>
        </main>
    </section>

    <div id="toast" class="hidden fixed bottom-4 left-1/2 -translate-x-1/2 z-[60] bg-neutral-900 text-white text-sm font-bold px-4 py-3 rounded-xl shadow-lg max-w-[90vw] text-center"></div>

    <!-- ===== Nuevo pedido (mostrador / teléfono) ===== -->

        <div class="max-w-2xl mx-auto min-h-screen bg-neutral-100">

            <div class="px-4 py-5 space-y-4">
                <p id="nuevo-ok" class="hidden text-sm font-bold text-green-800 bg-green-100 border border-green-300 rounded-xl px-4 py-3"></p>

                <div id="nuevo-tipo" class="grid grid-cols-3 gap-2"></div>

                <div class="bg-white rounded-2xl border border-neutral-200 p-4 space-y-3">
                    <div class="text-xs font-semibold uppercase tracking-wider text-neutral-500">Pizzas</div>
                    <div id="nuevo-constructor" class="space-y-3"></div>
                    <div id="nuevo-pizzas" class="space-y-2"></div>
                </div>

                <div class="bg-white rounded-2xl border border-neutral-200 p-4 space-y-2">
                    <div class="text-xs font-semibold uppercase tracking-wider text-neutral-500">Extras</div>

                    <div id="nuevo-pago" class="flex flex-wrap gap-2"></div>
                    <div class="text-xs font-semibold uppercase tracking-wider text-neutral-500 pt-1">Cómo entra</div>

                </div>

                <div id="nuevo-envio-box" class="hidden bg-white rounded-2xl border border-neutral-200 p-4 space-y-2">

                </div>

                        <input id="nuevo-descuento" type="number" inputmode="numeric" min="0" placeholder="0" class="w-32 bg-neutral-50 border border-neutral-300 rounded-xl px-3 py-2 text-sm text-right">
                    </div>
                    <div id="nuevo-total"></div>
                </div>

                <button id="nuevo-guardar" type="button" class="sticky bottom-3 shadow-lg w-full bg-red-700 hover:bg-red-800 disabled:opacity-50 text-white font-bold py-3.5 rounded-xl transition">💾 Guardar pedido</button>
            </div>
        </div>
    </div>

    <!-- ===== Caja / Cierre diario (solo administrador) ===== -->
    <div id="modal-caja" class="hidden fixed inset-0 z-40 bg-black/50 overflow-y-auto">
        <div class="max-w-2xl mx-auto min-h-screen bg-neutral-100">
            <div class="sticky top-0 z-10 bg-neutral-900 text-white">

                    <h2 class="font-extrabold">📊 Caja y cierres</h2>
                    <button id="caja-cerrar-modal" type="button" class="text-xs bg-white/20 hover:bg-white/30 font-bold px-3 py-1.5 rounded-lg">✖ Volver</button>

                    <button type="button" data-tab="historial" class="caja-tab text-xs font-bold px-3 py-1.5 rounded-full">Historial de cierres</button>
                    <button type="button" data-tab="clientes" class="caja-tab text-xs font-bold px-3 py-1.5 rounded-full">Clientes</button>
                </div>
            </div>
            <div id="caja-contenido" class="px-4 py-5 space-y-4"></div>
        </div>
    </div>

    <!-- ===== Configuración ===== -->
    <div id="modal-config" class="hidden fixed inset-0 z-40 bg-neutral-100 overflow-y-auto">

            <div class="max-w-4xl mx-auto px-4 py-3 flex items-center justify-between gap-2">
                <h2 class="font-extrabold">⚙️ Configuración</h2>
                <button id="cfg-cerrar" type="button" class="text-xs bg-white/20 hover:bg-white/30 font-bold px-3 py-1.5 rounded-lg">✖ Volver al TPV</button>

    <!-- ===== Editar cliente ===== -->
    <div id="modal-cliente" class="hidden fixed inset-0 z-50 bg-black/60 overflow-y-auto">
        <div class="max-w-md mx-auto min-h-screen sm:min-h-0 sm:mt-8 bg-neutral-100 sm:rounded-2xl overflow-hidden">
            <div class="bg-neutral-900 text-white px-4 py-3 flex items-center justify-between">
                <h2 id="cli-titulo" class="font-extrabold">✏️ Editar cliente</h2>
                <button id="cli-cerrar" type="button" class="text-xs bg-white/20 hover:bg-white/30 font-bold px-3 py-1.5 rounded-lg">✖ Cerrar</button>
            </div>
            <div class="p-4 space-y-3">
                <p id="cli-error" class="hidden text-sm text-red-700 bg-red-50 border border-red-200 rounded-xl px-4 py-3"></p>
                <div><label class="block text-xs font-semibold text-neutral-500 mb-1">Nombre</label>
                <input id="cli-nombre" type="text" maxlength="60" class="w-full bg-white border border-neutral-300 rounded-xl px-3 py-2 text-sm"></div>
                <div><label class="block text-xs font-semibold text-neutral-500 mb-1">Celular</label>
                <input id="cli-celular" type="tel" inputmode="tel" maxlength="20" placeholder="Ej. 0981 123 456" class="w-full bg-white border border-neutral-300 rounded-xl px-3 py-2 text-sm"></div>
                <div><label class="block text-xs font-semibold text-neutral-500 mb-1">Ubicación (dirección o link de Google Maps)</label>
                <input id="cli-direccion" type="text" maxlength="500" class="w-full bg-white border border-neutral-300 rounded-xl px-3 py-2 text-sm"></div>
                <button id="cli-guardar" type="button" class="w-full bg-red-700 hover:bg-red-800 text-white font-bold py-3 rounded-xl">💾 Guardar cliente</button>
                <button id="cli-eliminar" type="button" class="hidden w-full bg-red-100 hover:bg-red-200 text-red-700 font-bold py-2.5 rounded-xl text-sm">🗑️ Eliminar cliente</button>
            </div>
        </div>
    </div>

    <!-- ===== Pantalla de cocina ===== -->
    <div id="vista-cocina" class="hidden fixed inset-0 z-30 bg-neutral-900 text-white overflow-y-auto">
        <div class="sticky top-0 z-10 bg-black px-4 py-3 flex items-center justify-between">
            <div><h2 class="font-extrabold text-lg">👨‍🍳 Cocina</h2><p id="cocina-cont" class="text-xs opacity-80"></p></div>
            <button id="cocina-cerrar" type="button" class="text-xs bg-white/20 hover:bg-white/30 font-bold px-3 py-1.5 rounded-lg">✖ Salir</button>
        </div>
        <div id="cocina-lista" class="p-3 grid gap-3" style="grid-template-columns:repeat(auto-fill,minmax(280px,1fr))"></div>
    </div>

    <!-- ===== Cobro (efectivo con vuelto, transferencia, POS) ===== -->
    <div id="modal-agotados" class="hidden fixed inset-0 z-50 bg-black/60 overflow-y-auto">
        <div class="max-w-lg mx-auto min-h-screen sm:min-h-0 sm:mt-8 bg-neutral-100 sm:rounded-2xl overflow-hidden">
            <div class="bg-neutral-900 text-white px-4 py-3 flex items-center justify-between">
                <h2 class="font-extrabold">🚫 Sabores agotados</h2>
                <button id="agot-cerrar" type="button" class="text-xs bg-white/20 hover:bg-white/30 font-bold px-3 py-1.5 rounded-lg">✖ Cerrar</button>
            </div>
            <div id="agot-cuerpo" class="p-4 space-y-4"></div>
        </div>
    </div>

    <div id="modal-cobro" class="hidden fixed inset-0 z-50 bg-black/60 overflow-y-auto">
        <div class="max-w-md mx-auto min-h-screen sm:min-h-0 sm:mt-8 bg-neutral-100 sm:rounded-2xl overflow-hidden">
            <div class="bg-neutral-900 text-white px-4 py-3 flex items-center justify-between">
                <h2 id="cobro-titulo" class="font-extrabold">💰 Cobrar</h2>
                <button id="cobro-cerrar" type="button" class="text-xs bg-white/20 hover:bg-white/30 font-bold px-3 py-1.5 rounded-lg">✖ Cerrar</button>
            </div>
            <div id="cobro-cuerpo" class="p-4 space-y-4"></div>
        </div>
    </div>

    <datalist id="dl-nombres"></datalist><datalist id="dl-cels"></datalist>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
        import { getFirestore, collection, query, orderBy, limit, onSnapshot, doc, updateDoc, serverTimestamp, writeBatch, getDocs, addDoc, deleteDoc, where, setDoc, getDoc, runTransaction, increment, getCountFromServer } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBczdHiqe4fO6XThYRQky-WBlwgdhWDYCI",
            authDomain: "mi-barrio-pedidos.firebaseapp.com",
            projectId: "mi-barrio-pedidos",
            storageBucket: "mi-barrio-pedidos.firebasestorage.app",
            messagingSenderId: "495947210483",
            appId: "1:495947210483:web:949ae24ccf15bd025a6186"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // ===== Configuración =====
        let NOMBRE_LOCAL = 'MI BARRIO';
        const MIN_ATENCION = 15;   
        const MIN_URGENTE = 30;    

        const ESTADOS = {
            nuevo:       { label: 'Nuevo',          badge: 'bg-green-600 text-white', siguiente: 'preparacion', btn: '👨‍🍳 Pasar a En preparación', anterior: null },
            preparacion: { label: 'En preparación', badge: 'bg-amber-500 text-white', siguiente: 'en_camino',   btn: '🛵 Marcar En camino',        anterior: null },
            en_camino:   { label: 'En camino',      badge: 'bg-blue-600 text-white',  siguiente: 'entregado',   btn: '✅ Marcar Entregado',         anterior: null },
            entregado:   { label: 'Entregado',      badge: 'bg-neutral-500 text-white', siguiente: null,        btn: null,                          anterior: null },
            cancelado:   { label: 'Cancelado',      badge: 'bg-red-600 text-white',   siguiente: null,          btn: null,                          anterior: null }
        };
        const ACTIVOS = ['nuevo', 'preparacion', 'en_camino'];
        // Un pedido solo avanza o se cancela. No hay vuelta atrás y "cancelado" es definitivo.
        const TRANSICIONES = {
            nuevo:       ['preparacion', 'cancelado'],
            preparacion: ['en_camino', 'entregado', 'cancelado'],
            en_camino:   ['entregado', 'cancelado'],
            entregado:   ['cancelado'],
            cancelado:   []
        };
        const PAGOS = {
            efectivo:      { label: 'Efectivo',      icono: '💵' },
            transferencia: { label: 'Transferencia', icono: '🏦' },
            pos:           { label: 'POS',           icono: '💳' }
        };
        const FILTROS = [
            ['todos', 'Todos'], ['nuevo', 'Nuevos'], ['preparacion', 'En prep.'],
            ['en_camino', 'En camino'], ['entregado', 'Entregados'], ['cancelado', 'Cancelados']
        ];

        const $ = (id) => document.getElementById(id);
        let cancelarEscucha = null;
        let pedidos = [];
        let vistos = null;           
        let recien = new Set();      
        let filtro = 'todos';
        let panelAbierto = false;
        let esDelivery = false; 

        // ===== Utilidades =====
        function esc(t) {
            return String(t ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
        }
        function gs(n) { return Number(n || 0).toLocaleString('es-PY') + ' Gs'; }
        function estadoDe(p) { return ESTADOS[p.estado] ? p.estado : 'nuevo'; }
        function creadoMs(p) { return p.creado && p.creado.toMillis ? p.creado.toMillis() : Date.now(); }
        function fechaCorta(ms) {
            return new Date(ms).toLocaleString('es-PY', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' });
        }
        function numeroCorto(p) { return p.numero ? '#' + p.numero : '#--'; }
        // Celular -> 595981123456 (acepta 0981..., 981..., 595981..., +595 981...)
        function waNumero(v) {
            let d = String(v || '').replace(/\D/g, '');
            if (d.startsWith('595')) d = d.slice(3);

            const resto = t.replace(m[1], '').trim();
            return (resto ? `<div>📍 ${esc(resto)}</div>` : '') +
                `<a href="${esc(url)}" target="_blank" rel="noopener" class="inline-block text-xs bg-red-100 text-red-700 font-bold px-2.5 py-1 rounded-lg hover:bg-red-200">🗺️ Abrir ubicación</a>`;

        async function desbloquearAudio() {

            g.gain.setValueAtTime(0.0001, inicio);
            g.gain.exponentialRampToValueAtTime(0.5, inicio + 0.02);
            g.gain.exponentialRampToValueAtTime(0.0001, inicio + dur);
            osc.connect(g);
            g.connect(ctx.destination);
            osc.start(inicio);
            osc.stop(inicio + dur + 0.05);
        }

        // ===== Horario del local (la misma lógica la usa la página de pedidos) =====
        const TZ_LOCAL = 'America/Asuncion';
        const DIAS_N = ['Domingo', 'Lunes', 'Martes', 'Miércoles', 'Jueves', 'Viernes', 'Sábado'];
        function pyAhora(ms) {
            const p = new Intl.DateTimeFormat('en-US', { timeZone: TZ_LOCAL, weekday: 'short', hour: 'numeric', minute: 'numeric', hourCycle: 'h23' }).formatToParts(new Date(ms));
            const g = (t) => (p.find(x => x.type === t) || {}).value;
            return { dia: ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'].indexOf(g('weekday')), min: (Number(g('hour')) % 24) * 60 + Number(g('minute')) };
        }
        function aMin(t) { const m = /^(\d{1,2}):(\d{2})$/.exec(t || ''); return m ? Number(m[1]) * 60 + Number(m[2]) : null; }
        function abiertoHorario(h, dia, min) {
            for (const t of ((h && h[dia]) || [])) {
                const a = aMin(t.a), c = aMin(t.c);
                if (a === null || c === null || a === c) continue;
                if (a < c ? (min >= a && min < c) : (min >= a)) return true;
            }
            for (const t of ((h && h[(dia + 6) % 7]) || [])) {   // turno de ayer que cierra después de medianoche
                const a = aMin(t.a), c = aMin(t.c);
                if (a === null || c === null || a === c) continue;
                if (a > c && min < c) return true;
            }
            return false;
        }
        function hayHorarios(h) {
            return !!h && Object.values(h).some(arr => (arr || []).some(t => aMin(t.a) !== null && aMin(t.c) !== null && aMin(t.a) !== aMin(t.c)));
        }
        // Próximo momento en que el horario cambia de abierto a cerrado o al revés
        function proximoCambio(h, desde) {
            const b = pyAhora(desde), base = Math.floor(desde / 60000) * 60000;
            const actual = abiertoHorario(h, b.dia, b.min);
            for (let k = 1; k <= 8 * 1440; k++) {
                const t = b.min + k;
                const ab = abiertoHorario(h, (b.dia + Math.floor(t / 1440)) % 7, t % 1440);
                if (ab !== actual) return { ms: base + k * 60000, abre: ab };
            }
            return null;
        }
        function normLocal(d) {
            d = d || {};
            return {
                auto: !!d.auto,
                manual: (d.manual === 'abierto' || d.manual === 'cerrado') ? d.manual : null,
                manualHasta: Number(d.manualHasta) || null,
                horarios: d.horarios || {},
                mensaje: d.mensaje || '',
                agotados: Array.isArray(d.agotados) ? d.agotados.map(String) : [],
                tema: ['clasico', 'bonito', 'noche'].indexOf(d.tema) >= 0 ? d.tema : 'clasico'
            };
        }
        // Estado real ahora: el botón manual manda hasta el próximo cambio del horario
        function estadoLocal(cfg, ahora) {
            cfg = cfg || {};
            if (cfg.manual && (!cfg.manualHasta || ahora < cfg.manualHasta)) return { abierto: cfg.manual === 'abierto', modo: 'manual', hasta: cfg.manualHasta || null };
            if (cfg.auto && hayHorarios(cfg.horarios)) { const b = pyAhora(ahora); return { abierto: abiertoHorario(cfg.horarios, b.dia, b.min), modo: 'auto', hasta: null }; }
            return { abierto: true, modo: 'libre', hasta: null };
        }
        function fmtHora(ms) { return new Intl.DateTimeFormat('es-PY', { timeZone: TZ_LOCAL, hour: '2-digit', minute: '2-digit', hourCycle: 'h23' }).format(new Date(ms)); }
        function textoApertura(cfg, ahora) {
            if (!cfg || !cfg.auto || !hayHorarios(cfg.horarios)) return '';
            let desde = ahora;
            if (cfg.manual && cfg.manualHasta && cfg.manualHasta > ahora) desde = cfg.manualHasta;
            let cuando = desde;
            const b0 = pyAhora(desde);
            if (!abiertoHorario(cfg.horarios, b0.dia, b0.min)) { const c = proximoCambio(cfg.horarios, desde); if (!c) return ''; cuando = c.ms; }
            const a = pyAhora(ahora), b = pyAhora(cuando), dif = (b.dia - a.dia + 7) % 7;
            return 'Abrimos ' + (dif === 0 ? 'hoy' : dif === 1 ? 'mañana' : 'el ' + DIAS_N[b.dia].toLowerCase()) + ' a las ' + fmtHora(cuando);
        }

        let localCfg = normLocal({});

        // quiere: 'abierto' | 'cerrado' | null (volver al horario automático)

        // ===== Sabores agotados (se guardan en config/local y la página de pedidos los bloquea al instante) =====

                + cats.map(([c, n]) => `<div><div class="text-xs font-semibold uppercase tracking-wider text-neutral-500 mb-2">${n}</div><div class="flex flex-wrap gap-2">${((MENU.sabores && MENU.sabores[c]) || []).map(s => `<button type="button" data-agot="${esc(s)}" class="text-sm font-bold px-3 py-2 rounded-xl border ${ag.has(s) ? 'bg-red-600 text-white border-red-700 line-through' : 'bg-white border-neutral-300 hover:bg-neutral-50'}">${ag.has(s) ? '🚫 ' : ''}${esc(s)}</button>`).join('')}</div></div>`).join('')

        async function guardarAgotados(lista) {

        // ===== Comanda de cocina automática =====
        // Solo se imprime en los equipos que tienen el botón "Auto" en ON (por defecto: solo PC).
        // Cada pedido se marca como impreso en la base de datos, así que no sale dos veces aunque haya dos pantallas abiertas.
        const colaComanda = new Map();   // id del pedido -> momento en que llegó
        let autoImprimir = (() => {
            try { const v = localStorage.getItem('autoComanda'); if (v === '1') return true; if (v === '0') return false; } catch (e) {}
            return window.innerWidth >= 1024;
        })();
        let procesandoComandas = false;

            const b = $('btn-autoprint');

        }

        async function procesarColaComandas() {
            if (!autoImprimir || esDelivery) { colaComanda.clear(); return; }
            if (procesandoComandas) return;

            try {
                for (const [id, desde] of [...colaComanda]) {
                    const ped = pedidos.find(x => x.id === id);
                    if (!ped || ped.comandaImpresa) { colaComanda.delete(id); continue; }
                    if (!ped.numero && Date.now() - desde < 8000) continue;   // espera a que le asignen el número
                    colaComanda.delete(id);
                    let numero = ped.numero;
                    let ganado = false;
                    try {
                        ganado = await runTransaction(db, async (tx) => {
                            const r = doc(db, 'pedidos', id);
                            const d = await tx.get(r);
                            if (!d.exists() || d.data().comandaImpresa) return false;

                            return true;
                        });

                        mostrarError('No se pudo imprimir la comanda automática: ' + (e.code === 'permission-denied' ? 'falta publicar las reglas nuevas.' : e.message));
                    }

            if (colaComanda.size) setTimeout(procesarColaComandas, 2000);
        }

        // ===== Pedidos en vivo =====
        function escucharPedidos() {
            // Optimización: filtrar por estado en el servidor para no leer cancelados/archivados
            const q = query(collection(db, 'pedidos'), where('estado', 'in', ['nuevo', 'preparacion', 'en_camino', 'entregado', 'cancelado']), limit(300));

                if (vistos !== null && !esDelivery) {
                    pedidos.forEach(x => { if (!vistos.has(x.id) && !x.comandaImpresa && x.estado !== 'cancelado' && x.estado !== 'archivado') colaComanda.set(x.id, Date.now()); });
                }
                if (vistos !== null) {
                    const llegaron = pedidos.filter(p => !vistos.has(p.id) && !propios.has(p.id));

        async function cambiarEstado(id, estado) {
            if (esDelivery) return;
            const actual = pedidos.find(x => x.id === id);
            if (!actual || !(TRANSICIONES[estadoDe(actual)] || []).includes(estado)) {
                mostrarError('Ese cambio no está permitido: un pedido no puede volver atrás, solo avanzar o cancelarse.');
                return;
            }
            try {
                await updateDoc(doc(db, 'pedidos', id), { estado: estado, estadoActualizado: serverTimestamp() });
            } catch (e) {
                mostrarError('No se pudo cambiar el estado: ' + e.message);
            }
        }

        async function cambiarPago(id, pago) {
            if (esDelivery) return;
            try {
                await updateDoc(doc(db, 'pedidos', id), { pago: pago });
            } catch (e) {
                mostrarError('No se pudo guardar la forma de pago: ' + e.message);
            }
        }

        $('filtros').addEventListener('click', (e) => {
            const b = e.target.closest('[data-filtro]');
            if (!b) return;
            filtro = b.dataset.filtro;
            render();
        });

        $('lista').addEventListener('click', (e) => {
            const b = e.target.closest('[data-accion]');
            if (!b) return;
            const p = pedidos.find(x => x.id === b.dataset.id);
            if (!p) return;
            const acc = b.dataset.accion;
            if (acc === 'toggle') {
                if (abiertos.has(p.id)) abiertos.delete(p.id); else abiertos.add(p.id);
                render();
            } else if (acc === 'estado') {
                if (!esDelivery) cambiarEstado(p.id, b.dataset.estado);
            } else if (acc === 'pago') {
                if (!esDelivery) cambiarPago(p.id, b.dataset.pago === p.pago ? null : b.dataset.pago);
            } else if (acc === 'imprimir') {
                imprimirTicket(p);
            } else if (acc === 'agregar') {
                if (!esDelivery) abrirAgregar(p);
            } else if (acc === 'comanda') {
                imprimirComanda(p);
            } else if (acc === 'cobrar') {
                if (!esDelivery) abrirCobro(p);
            } else if (acc === 'cancelar') {
                if (!esDelivery) {
                    const nombre = (p.cliente && p.cliente.nombre) || 'este cliente';
                    const aviso = estadoDe(p) === 'entregado'
                        ? '\n\nEste pedido ya figura como ENTREGADO: al cancelarlo deja de sumar en la caja.'
                        : '';
                    if (confirm('¿Cancelar el pedido de ' + nombre + '?' + aviso + '\n\nQuedará en la pestaña "Cancelados" y no se puede deshacer.')) {

            const gps = (c.lat && c.lng) ? `<div>GPS: ${esc(Number(c.lat).toFixed(5))}, ${esc(Number(c.lng).toFixed(5))}</div>` : '';

            const html = `<!DOCTYPE html>

  <script>window.onload = function () { window.focus(); window.print(); };

</body></html>`;

            const w = window.open('', '_blank', 'width=420,height=640');
            if (!w) {

            w.document.close();

        function actualizarFiltros() {
            if (esDelivery) {
                const enCamino = pedidos.filter(p => estadoDe(p) === 'en_camino').length;
                $('contador').textContent = enCamino === 0 
                    ? 'No tenés entregas pendientes' 
                    : enCamino + ' pedido(s) listo(s) para entregar';
                return;
            }

            const cuenta = { todos: 0 };
            Object.keys(ESTADOS).forEach(k => cuenta[k] = 0);
            pedidos.forEach(p => {
                const e = estadoDe(p);
                cuenta[e]++;
                if (e !== 'cancelado') cuenta.todos++;
            });
            $('filtros').innerHTML = FILTROS.map(([clave, texto]) => {
                const activo = clave === filtro;
                return `<button type="button" data-filtro="${clave}" class="shrink-0 text-xs font-bold px-3 py-1.5 rounded-full transition ${activo ? 'bg-white text-red-700' : 'bg-white/20 text-white hover:bg-white/30'}">${texto} <span class="opacity-80">${cuenta[clave]}</span></button>`;

            const c = p.cliente || {};

            const lt = Number(c.lat), ln = Number(c.lng);
            const enMsg = (String(p.mensaje || '').match(/https?:\/\/(?:maps\.google\.com|www\.google\.com\/maps|maps\.app\.goo\.gl|goo\.gl\/maps)[^\s*]*/i) || [])[0] || '';
            const mapa = /^https?:\/\//i.test(c.mapa || '') ? c.mapa

            const idAttr = esc(p.id);

            let sig = info.siguiente, btnSig = info.btn, ant = info.anterior;
            if (sinReparto) {
                if (e === 'preparacion') { sig = 'entregado'; btnSig = '✅ Marcar Entregado'; }

                if (sig) {

                if (ant) {
                    botones += `<button type="button" data-accion="estado" data-estado="${ant}" data-id="${idAttr}" class="text-xs bg-neutral-100 hover:bg-neutral-200 text-neutral-700 font-bold px-3 py-2.5 rounded-xl">⬅ ${esc(ESTADOS[ant].label)}</button>`;
                }
            }
            
            botones += `<button type="button" data-accion="imprimir" data-id="${idAttr}" class="text-xs bg-blue-100 hover:bg-blue-200 text-blue-800 font-bold px-3 py-2.5 rounded-xl">🖨️ Ticket</button>`;
            botones += `<button type="button" data-accion="comanda" data-id="${idAttr}" class="text-xs bg-orange-100 hover:bg-orange-200 text-orange-800 font-bold px-3 py-2.5 rounded-xl">🍳 Comanda</button>`;
            if (!esDelivery && e !== 'cancelado' && !p.pagado) botones += `<button type="button" data-accion="agregar" data-id="${idAttr}" class="text-xs bg-indigo-100 hover:bg-indigo-200 text-indigo-800 font-bold px-3 py-2.5 rounded-xl">➕ Agregar</button>`;
            if (!esDelivery && e !== 'cancelado' && !p.pagado) {
                botones = `<button type="button" data-accion="cobrar" data-id="${idAttr}" class="flex-1 min-w-[10rem] bg-neutral-900 hover:bg-black text-white font-bold text-sm py-2.5 rounded-xl active:scale-[0.98] transition">💰 Cobrar ${gs(p.total)}</button>` + botones;
            }

            if (e === 'en_camino' && c.celular) {
                botones += `<a href="https://wa.me/${esc(waNumero(c.celular))}?text=${encodeURIComponent(msgCamino(p))}" target="_blank" rel="noopener" class="text-xs bg-emerald-100 hover:bg-emerald-200 text-emerald-800 font-bold px-3 py-2.5 rounded-xl">💬 Avisar: va en camino</a>`;
            }

            const pagoActual = PAGOS[p.pago] ? p.pago : '';
            let pagoHtml = '';

            } else if (esDelivery && pagoActual) {
                pagoHtml = `<div class="text-sm font-bold">${PAGOS[pagoActual].icono} Pago: ${PAGOS[pagoActual].label}</div>`;

            if (!esDelivery) {
                if (e !== 'cancelado') {

                }

            if (p.pagado) pagoHtml += cobroInfoHtml(p);
            const abierto = abiertos.has(p.id);

            return `

                <div data-accion="toggle" data-id="${idAttr}" class="flex items-center justify-between gap-2 px-3 py-2.5 cursor-pointer select-none">

                        <span class="font-extrabold truncate max-w-[11rem]">${esc(c.nombre)}</span>
                        <span class="inline-block text-[11px] font-bold px-2 py-0.5 rounded-full bg-indigo-100 text-indigo-800">${tipoInfo.icono} ${esc(tipoInfo.label.toUpperCase())}${origenTxt}</span>

                        <span class="inline-block text-[11px] font-bold px-2 py-0.5 rounded-full ${info.badge}">${esc(info.label.toUpperCase())}</span>
                        ${p.pagado ? '<span class="inline-block text-[11px] font-bold px-2 py-0.5 rounded-full bg-green-100 text-green-800">✅ PAGADO</span>' : (e !== 'cancelado' && !esDelivery ? '<span class="inline-block text-[11px] font-bold px-2 py-0.5 rounded-full bg-amber-100 text-amber-800">💰 POR COBRAR</span>' : '')}
                        <span class="text-neutral-400 text-xs">${abierto ? '▲' : '▼'}</span>
                    </div>

                <div class="${abierto ? '' : 'hidden'} px-4 pb-4 pt-3 space-y-3 border-t border-neutral-100">
                    <div class="flex items-start justify-between gap-2">
                        <div>
                            ${c.celular ? `
                            <div class="flex flex-wrap items-center gap-2">
                                <span class="text-sm font-semibold text-neutral-700">📞 ${esc(telBonito(c.celular))}</span>
                                <a href="tel:+${esc(waNumero(c.celular))}" class="bg-green-600 hover:bg-green-700 text-white text-xs font-bold px-2.5 py-1 rounded-lg transition shadow-sm">📞 Llamar</a>
                                <a href="https://wa.me/${esc(waNumero(c.celular))}?text=${encodeURIComponent('¡Hola ' + c.nombre + '! Te escribimos de Mi Barrio por tu pedido ' + numeroCorto(p))}" target="_blank" rel="noopener" class="bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-bold px-2.5 py-1 rounded-lg transition">💬 WhatsApp</a>
                            </div>` : ''}
                            <div class="text-xs text-neutral-500 mt-1">${esc(numeroCorto(p))} · ${esc(fechaCorta(ms))}</div>

                    <div class="text-sm space-y-1">

                        ${mapa ? `<a href="${esc(mapa)}" target="_blank" rel="noopener" class="inline-block text-xs bg-red-100 text-red-700 font-bold px-2.5 py-1 rounded-lg hover:bg-red-200">🗺️ Ver ubicación en el mapa</a>` : ''}
                    </div>
                    <div class="space-y-2">${pizzas}</div>

                    ${p.costoDelivery ? `<div class="text-sm">🛵 Delivery: <strong>${gs(p.costoDelivery)}</strong></div>` : ''}
                    ${pagoHtml}
                    <div class="flex flex-wrap gap-2 pt-1">${botones}</div>
                </div>
            </article>`;
        }

        function render() {
            if (!$('vista-cocina').classList.contains('hidden')) renderCocina();
            actualizarFiltros();

            // SI ES DELIVERY: Filtra estrictamente los que están 'en_camino'
            const visibles = pedidos.filter(p => {
                const e = estadoDe(p);
                if (esDelivery) {
                    return e === 'en_camino';
                }
                return filtro === 'todos' ? e !== 'cancelado' : e === filtro;
            });

            if (visibles.length === 0) {
                $('lista').innerHTML = '<p class="text-center text-neutral-500 py-10">' +
                    (esDelivery 
                        ? 'No hay pedidos en camino en este momento. Apenas el local pase un pedido a "En camino", te aparecerá acá automáticamente.'
                        : (pedidos.length === 0 ? 'Cuando entre un pedido va a aparecer acá al instante.' : 'No hay pedidos en esta vista.')) + '</p>';
                return;
            }
            $('lista').innerHTML = visibles.map(tarjeta).join('');
        }

        // ===== Nuevo pedido (mostrador / teléfono) =====
        const TIPOS = {
            retiro:   { label: 'Retiro',      icono: '🛍️' },
            local:    { label: 'En el local', icono: '🍽️' },
            delivery: { label: 'Delivery',    icono: '🛵' }
        };
        // Mismos tamaños, sabores y precios que la página de pedidos (si cambian allá, cambiarlos acá también)
        const MENU = {
            tamanos: {
                'grande':      { nombre: 'Pizza Grande + Mediana muzza gratis', corto: 'Grande',     limite: 2, borde: 15000, precios: { clasico: 60000, especial: 75000, gourmet: 90000 } },
                'mediano':     { nombre: 'Pizza Mediana',                       corto: 'Mediana',    limite: 2, borde: 12000, precios: { clasico: 30000, especial: 40000, gourmet: 50000 } },
                'chico':       { nombre: 'Pizza Tren Chico',                    corto: 'Tren Chico', limite: 2, borde: 20000, precios: { clasico: 55000, especial: 65000, gourmet: 75000 } },
                'tren-grande': { nombre: 'Pizza Tren Grande',                   corto: 'Tren Grande', limite: 3, borde: 30000, precios: { clasico: 75000, especial: 90000, gourmet: 110000 } }
            },
            sabores: {
                gourmet:  ['Suprema', 'Carnívora', 'Carne Katupiry', 'Pollo Katupiry', 'Mexicana', 'Barbacoa de la Casa', 'Costilla BBC'],
                especial: ['Calabacón', 'Especial', 'Peperonni', 'Carbonara', 'Cuatro Quesos', 'Calabresa', 'Bacon', 'Pollo Cheddar', 'Portuguesa'],
                clasico:  ['Muzza', 'Choclo', 'Palmito', 'Vegetariana', 'Napolitana', 'Jamón', 'Margarita', 'Pollo bbc', 'Ajo & Aceite', 'Queso Paraguay']
            },
            extras: [
                ['papas-med', 'Papas Medianas', 15000],
                ['papas-gra', 'Papas Grandes', 25000],
                ['coca-500', 'Coca Cola 500ml', 8000],
                ['coca-1l', 'Coca Cola 1LT', 12000],
                ['coca-15l', 'Coca Cola 1.5LT', 17000]
            ]
        };
        const GRUPOS_SABOR = [['gourmet', '⭐ Gourmet', 'text-amber-700 bg-amber-50'], ['especial', '✨ Especiales', 'text-blue-700 bg-blue-50'], ['clasico', '🍃 Clásicos', 'text-green-700 bg-green-50']];

        let propios = new Set();   // pedidos cargados desde este panel (no suenan como "nuevo")
        let nuevo = { tipo: 'retiro', tamano: 'grande', sabores: [], borde: false, pizzas: [], extras: {}, pago: '', entrada: 'nuevo', guardando: false, envio: 0 };

        function nuevoCat(sabores) {
            if (sabores.some(x => MENU.sabores.gourmet.includes(x))) return 'gourmet';
            if (sabores.some(x => MENU.sabores.especial.includes(x))) return 'especial';
            return 'clasico';
        }
        function nuevoPrecio(tam, sabores, borde) {
            const t = MENU.tamanos[tam];
            return t.precios[nuevoCat(sabores)] + (borde ? t.borde : 0);
        }
        function nuevoTotales() {
            const sub = nuevo.pizzas.reduce((a, z) => a + z.precio, 0) +
                MENU.extras.reduce((a, x) => a + (nuevo.extras[x[0]] || 0) * x[2], 0);
            const desc = Math.max(0, Math.round(Number($('nuevo-descuento').value) || 0));
            const env = nuevo.tipo === 'delivery' ? nuevo.envio : 0;
            return { sub, desc, env, total: Math.max(0, sub + env - desc) };
        }
        function nuevoMsg(id, texto) {
            const el = $(id);
            if (texto) {
                el.textContent = texto; el.classList.remove('hidden');
                try { el.scrollIntoView({ behavior: 'smooth', block: 'center' }); } catch (e) {}
            } else { el.classList.add('hidden'); }
        }
        const clsOn = 'bg-red-700 text-white border-red-700';
        const clsOff = 'bg-white text-neutral-700 border-neutral-300 hover:bg-neutral-50';

        function renderNuevo() {
            // tipo
            $('nuevo-tipo').innerHTML = Object.entries(TIPOS).map(([k, v]) =>
                `<button type="button" data-n-tipo="${k}" class="py-3 rounded-xl text-sm font-bold border ${nuevo.tipo === k ? clsOn : clsOff}"><div class="text-xl">${v.icono}</div>${v.label}</button>`).join('');
