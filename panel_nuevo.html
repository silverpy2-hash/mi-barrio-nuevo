            $('nuevo-nombre').placeholder = nuevo.tipo === 'local' ? 'Mesa o nombre' : (nuevo.tipo === 'retiro' ? 'Nombre (si no, queda "Mostrador")' : 'Nombre del cliente');

            // constructor de pizza
            const t = MENU.tamanos[nuevo.tamano];
            const tams = Object.entries(MENU.tamanos).map(([k, v]) =>
                `<button type="button" data-n-tam="${k}" class="py-2 rounded-xl text-xs font-bold border ${nuevo.tamano === k ? clsOn : clsOff}">${esc(v.corto)}<div class="font-normal opacity-80">desde ${Number(v.precios.clasico).toLocaleString('es-PY')}</div></button>`).join('');
            const grupos = GRUPOS_SABOR.map(([cat, titulo, clase]) =>
                `<div><div class="text-xs font-bold uppercase tracking-wider px-2 py-1 rounded mb-1.5 ${clase}">${titulo} · ${gs(t.precios[cat])}</div><div class="flex flex-wrap gap-1.5">` +
                MENU.sabores[cat].map(sb => `<button type="button" data-n-sabor="${esc(sb)}" class="text-xs font-semibold px-2.5 py-1.5 rounded-full border ${nuevo.sabores.includes(sb) ? clsOn : clsOff}">${esc(sb)}</button>`).join('') +
                `</div></div>`).join('');
            const precio = nuevo.sabores.length ? nuevoPrecio(nuevo.tamano, nuevo.sabores, nuevo.borde) : 0;
            $('nuevo-constructor').innerHTML = `
                <div class="grid grid-cols-4 gap-1.5">${tams}</div>
                ${grupos}
                <button type="button" data-n-borde class="text-xs font-bold px-3 py-2 rounded-xl border ${nuevo.borde ? clsOn : clsOff}">🧀 Borde relleno (+${gs(t.borde)})</button>
                <div class="flex items-center justify-between gap-2">
                    <div class="text-sm">${nuevo.sabores.length ? '<strong>' + esc(nuevo.sabores.join(' / ')) + '</strong><br><span class="text-xs text-neutral-500">' + esc(t.corto) + ' · ' + gs(precio) + '</span>' : '<span class="text-xs text-neutral-500">Elegí los sabores (máx. ' + t.limite + ')</span>'}</div>
                    <button type="button" data-n-addpizza ${nuevo.sabores.length ? '' : 'disabled'} class="shrink-0 bg-neutral-800 hover:bg-black disabled:opacity-40 text-white text-sm font-bold px-4 py-2.5 rounded-xl">＋ Agregar pizza</button>
                </div>`;

            // pizzas agregadas
            $('nuevo-pizzas').innerHTML = nuevo.pizzas.map((z, i) => `
                <div class="flex items-center justify-between gap-2 bg-neutral-50 rounded-xl px-3 py-2 text-sm">
                    <div><div class="font-bold">🍕 ${esc(MENU.tamanos[z.tamano].corto)}${z.borde ? ' · Borde relleno' : ''}</div><div class="text-xs text-neutral-600">${esc(z.sabores.join(' / '))}</div></div>
                    <div class="flex items-center gap-2 shrink-0"><span class="font-semibold">${gs(z.precio)}</span><button type="button" data-n-delpizza="${i}" class="text-xs text-red-600 font-bold">✖</button></div>
                </div>`).join('');

            // extras
            $('nuevo-extras').innerHTML = MENU.extras.map(([k, nombre, pr]) => {
                const n = nuevo.extras[k] || 0;
                return `<div class="flex items-center justify-between gap-2 text-sm">
                    <span>${esc(nombre)} <span class="text-xs text-neutral-500">${gs(pr)}</span></span>
                    <span class="flex items-center gap-2">
                        <button type="button" data-n-extra="${k}" data-delta="-1" class="w-8 h-8 rounded-lg bg-neutral-100 font-bold">−</button>
                        <span class="w-5 text-center font-bold">${n}</span>
                        <button type="button" data-n-extra="${k}" data-delta="1" class="w-8 h-8 rounded-lg bg-neutral-800 text-white font-bold">+</button>
                    </span></div>`;
            }).join('');

            // costo de delivery
            $('nuevo-envio-box').classList.toggle('hidden', nuevo.tipo !== 'delivery');
            $('nuevo-envio').innerHTML = (MENU.envios || [6000, 8000, 10000, 12000]).map(v => `<button type="button" data-n-envio="${v}" class="text-xs font-bold px-3 py-2 rounded-xl border ${nuevo.envio === v ? clsOn : clsOff}">${v / 1000} mil</button>`).join('');

            // pago y entrada
            $('nuevo-pago').innerHTML = Object.entries(PAGOS).map(([k, v]) =>
                `<button type="button" data-n-pago="${k}" class="text-xs font-bold px-3 py-2 rounded-xl border ${nuevo.pago === k ? clsOn : clsOff}">${v.icono} ${v.label}</button>`).join('');
            $('nuevo-entrada').innerHTML = [['nuevo', '🔔 A cocina (pedido nuevo)'], ['entregado', '✅ Ya entregado y cobrado']].map(([k, tx]) =>
                `<button type="button" data-n-entrada="${k}" class="text-xs font-bold px-3 py-2 rounded-xl border ${nuevo.entrada === k ? clsOn : clsOff}">${tx}</button>`).join('');

            renderNuevoTotal();
        }

        function renderNuevoTotal() {
            const { sub, desc, env, total } = nuevoTotales();
            if (!nuevo.guardando) $('nuevo-guardar').textContent = '💾 Guardar pedido · ' + gs(total);
            $('nuevo-total').innerHTML = `
                ${(desc > 0 || env > 0) ? `<div class="flex justify-between text-sm text-neutral-600"><span>Subtotal</span><span>${gs(sub)}</span></div>` : ''}${env > 0 ? `<div class="flex justify-between text-sm text-neutral-600"><span>🛵 Delivery</span><span>+ ${gs(env)}</span></div>` : ''}${desc > 0 ? `<div class="flex justify-between text-sm text-red-700"><span>Descuento</span><span>− ${gs(desc)}</span></div>` : ''}
                <div class="flex justify-between items-center"><span class="font-bold">TOTAL</span><span class="text-2xl font-black text-red-700">${gs(total)}</span></div>`;
        }

        function nuevoLimpiar() {
            ['nuevo-nombre', 'nuevo-celular', 'nuevo-direccion', 'nuevo-notas', 'nuevo-descuento'].forEach(id => { $(id).value = ''; });
            nuevo.sabores = []; nuevo.borde = false; nuevo.pizzas = []; nuevo.extras = {}; nuevo.pago = ''; nuevo.envio = 0; nuevo.agregarA = null;
        }

        let toastTimer = null;
        function mostrarToast(texto) {
            const t = $('toast');
            t.textContent = texto;
            t.classList.remove('hidden');
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => t.classList.add('hidden'), 4000);
        }

        async function guardarNuevo() {
            if (esDelivery || nuevo.guardando) return;
            nuevoMsg('nuevo-ok', ''); nuevoMsg('nuevo-error', '');
            const n = nuevo;
            if (n.sabores.length) { nuevoMsg('nuevo-error', 'Tenés sabores elegidos sin agregar. Tocá "＋ Agregar pizza" o desmarcalos.'); return; }
            const extras = MENU.extras.filter(x => (n.extras[x[0]] || 0) > 0).map(x => ({ item: x[1], cantidad: n.extras[x[0]] }));
            if (!n.pizzas.length && !extras.length) { nuevoMsg('nuevo-error', 'Agregá al menos una pizza o un extra.'); return; }
            const direccion = n.tipo === 'delivery' ? $('nuevo-direccion').value.trim() : '';
            if (n.tipo === 'delivery' && !direccion) { nuevoMsg('nuevo-error', 'Para delivery escribí la dirección.'); return; }
            const celRaw = $('nuevo-celular').value.trim();
            const celular = celRaw ? waNumero(celRaw) : '';
            if (celRaw && celular.length !== 12) { nuevoMsg('nuevo-error', 'Revisá el celular. Ejemplo: 0981 123 456'); return; }
            const nombre = $('nuevo-nombre').value.trim() || (n.tipo === 'retiro' ? 'Mostrador' : (n.tipo === 'local' ? 'En el local' : 'Cliente'));
            const notas = $('nuevo-notas').value.trim();
            const { sub, desc, env, total } = nuevoTotales();

            const pizzas = n.pizzas.map(z => ({ tamano: z.tamano, nombre: MENU.tamanos[z.tamano].nombre, sabores: z.sabores, borde: !!z.borde, precio: z.precio }));
            const lineas = ['*PEDIDO ' + TIPOS[n.tipo].label.toUpperCase() + ' (cargado en el panel)*', 'Cliente: ' + nombre];
            if (celular) lineas.push('Celular: ' + telBonito(celular));
            if (direccion) lineas.push('Dirección: ' + direccion);
            pizzas.forEach((z, i) => lineas.push('• Pizza ' + (i + 1) + ' ' + z.nombre + ': ' + z.sabores.join(', ') + (z.borde ? ' · Borde relleno' : '') + ' - ' + gs(z.precio)));
            extras.forEach(x => lineas.push('• ' + x.item + ' x' + x.cantidad));
            if (notas) lineas.push('Notas: ' + notas);
            if (env > 0) lineas.push('Delivery: ' + gs(env));
            if (desc > 0) lineas.push('Descuento: ' + gs(desc));
            lineas.push('TOTAL: ' + gs(total));

            const datos = {
                local: 'mi-barrio',
                estado: n.entrada,
                creado: serverTimestamp(),
                tipo: n.tipo,
                origen: 'panel',
                pago: n.pago || null,
                pagado: !!(n.pago && n.entrada === 'entregado'),
                descuento: desc,
                costoDelivery: env,
                cliente: { nombre: nombre, direccion: direccion, celular: celular, notas: notas },
                pizzas: pizzas,
                extras: extras,
                total: total,
                mensaje: lineas.join('\n')
            };
            if (n.entrada === 'entregado') datos.estadoActualizado = serverTimestamp();

            const ref = doc(collection(db, 'pedidos'));
            propios.add(ref.id);
            nuevo.guardando = true;
            $('nuevo-guardar').disabled = true;
            $('nuevo-guardar').textContent = 'Guardando...';
            try {
                await runTransaction(db, async (tx) => {
                    const c = await tx.get(refContador());
                    datos.numero = ((c.exists() && c.data().ultimo) || 0) + 1;
                    tx.set(refContador(), { ultimo: datos.numero }, { merge: true });
                    tx.set(ref, datos);
                });
                recordarCliente({ cliente: datos.cliente, total: total });
                nuevoLimpiar();
                renderNuevo();
                $('modal-nuevo').classList.add('hidden');
                mostrarToast('✅ Pedido #' + datos.numero + ' guardado · ' + gs(total));
            } catch (e) {
                propios.delete(ref.id);
                nuevoMsg('nuevo-error', e.code === 'permission-denied'
                    ? 'Firebase no dejó guardar el pedido: falta publicar las reglas nuevas (reglas_firestore.txt) o no entraste como administrador.'
                    : 'No se pudo guardar el pedido: ' + e.message);
            } finally {
                nuevo.guardando = false;
                $('nuevo-guardar').disabled = false;
                renderNuevoTotal();
            }
        }

        $('btn-nuevo').addEventListener('click', () => {
            if (esDelivery) return;
            nuevoMsg('nuevo-ok', ''); nuevoMsg('nuevo-error', '');
            $('modal-nuevo').classList.remove('hidden');
            renderNuevo();
        });
        $('nuevo-descuento').addEventListener('input', renderNuevoTotal);
        $('modal-nuevo').addEventListener('click', (e) => {
            const b = e.target.closest('button');
            if (!b) return;
            const d = b.dataset;
            nuevoMsg('nuevo-error', '');
            if (b.id === 'nuevo-cerrar') { $('modal-nuevo').classList.add('hidden'); return; }
            if (b.id === 'nuevo-guardar') { if (nuevo.agregarA) guardarAgregado(); else guardarNuevo(); return; }
            if (d.nTipo) { nuevo.tipo = d.nTipo; }
            else if (d.nTam) {
                nuevo.tamano = d.nTam;
                nuevo.sabores = nuevo.sabores.slice(0, MENU.tamanos[d.nTam].limite);
            }
            else if (d.nSabor) {
                const i = nuevo.sabores.indexOf(d.nSabor);
                if (i >= 0) nuevo.sabores.splice(i, 1);
                else if (nuevo.sabores.length >= MENU.tamanos[nuevo.tamano].limite) { nuevoMsg('nuevo-error', 'Este tamaño admite hasta ' + MENU.tamanos[nuevo.tamano].limite + ' sabores.'); return; }
                else nuevo.sabores.push(d.nSabor);
            }
            else if ('nBorde' in d) { nuevo.borde = !nuevo.borde; }
            else if ('nAddpizza' in d) {
                if (!nuevo.sabores.length) return;
                nuevo.pizzas.push({ tamano: nuevo.tamano, sabores: nuevo.sabores.slice(), borde: nuevo.borde, precio: nuevoPrecio(nuevo.tamano, nuevo.sabores, nuevo.borde) });
                nuevo.sabores = []; nuevo.borde = false;
            }
            else if (d.nDelpizza !== undefined) { nuevo.pizzas.splice(Number(d.nDelpizza), 1); }
            else if (d.nExtra) { nuevo.extras[d.nExtra] = Math.max(0, (nuevo.extras[d.nExtra] || 0) + Number(d.delta)); }
            else if (d.nEnvio) { nuevo.envio = nuevo.envio === Number(d.nEnvio) ? 0 : Number(d.nEnvio); }
            else if (d.nPago) { nuevo.pago = nuevo.pago === d.nPago ? '' : d.nPago; }
            else if (d.nEntrada) { nuevo.entrada = d.nEntrada; }
            else return;
            renderNuevo();
        });

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') { $('modal-nuevo').classList.add('hidden'); $('modal-caja').classList.add('hidden'); }
        });
        $('modal-nuevo').addEventListener('click', (e) => { if (e.target === $('modal-nuevo')) $('modal-nuevo').classList.add('hidden'); });

        // ===== Caja y cierre diario =====
        let tabCaja = 'hoy';
        let cierres = [];

        function resumenActual() {
            const entregados = pedidos.filter(p => estadoDe(p) === 'entregado');
            const cancelados = pedidos.filter(p => estadoDe(p) === 'cancelado');
            const enCurso = pedidos.filter(p => ACTIVOS.includes(estadoDe(p)));
            const total = entregados.reduce((a, p) => a + Number(p.total || 0), 0);
            const porTamano = {};
            let pizzas = 0;
            entregados.forEach(p => (p.pizzas || []).forEach(z => {
                pizzas++;
                const k = z.nombre || 'Pizza';
                porTamano[k] = porTamano[k] || { nombre: k, cantidad: 0, monto: 0 };
                porTamano[k].cantidad++;
                porTamano[k].monto += Number(z.precio || 0);
            }));
            const porPago = { efectivo: 0, transferencia: 0, pos: 0, sinDefinir: 0 };
            entregados.forEach(p => { porPago[PAGOS[p.pago] ? p.pago : 'sinDefinir'] += Number(p.total || 0); });
            const porTipo = { delivery: { n: 0, monto: 0 }, retiro: { n: 0, monto: 0 }, local: { n: 0, monto: 0 } };
            entregados.forEach(p => {
                const k = (p.tipo === 'retiro' || p.tipo === 'local') ? p.tipo : 'delivery';
                porTipo[k].n++; porTipo[k].monto += Number(p.total || 0);
            });
            const totalGastos = gastos.reduce((a, g) => a + Number(g.monto || 0), 0);
            const sab = {}, hs = {};
            entregados.forEach(p => {
                (p.pizzas || []).forEach(z => (z.sabores || []).forEach(x => { sab[x] = (sab[x] || 0) + 1; }));
                const h = new Date(creadoMs(p)).getHours(); hs[h] = (hs[h] || 0) + 1;
            });
            const topSabores = Object.entries(sab).sort((a, b) => b[1] - a[1]).slice(0, 5).map(([nombre, cantidad]) => ({ nombre, cantidad }));
            const pico = Object.entries(hs).sort((a, b) => b[1] - a[1])[0];
            const horaPico = pico ? { hora: Number(pico[0]), pedidos: pico[1] } : null;
            return { entregados, cancelados, enCurso, total, pizzas, porTamano: Object.values(porTamano), porPago, porTipo, totalGastos, topSabores, horaPico, porHora: hs };
        }

        function bloqueResumen(r) {
            const filas = r.porTamano.map(t => `<div class="flex justify-between text-sm"><span>${esc(t.cantidad)} × ${esc(t.nombre)}</span><span class="font-semibold">${gs(t.monto)}</span></div>`).join('');
            return `
                <div class="bg-white rounded-2xl border border-neutral-200 p-4 space-y-3">
                    <div class="text-xs font-semibold uppercase tracking-wider text-neutral-500">Total vendido (pedidos entregados)</div>
                    <div class="text-3xl font-black text-red-700">${gs(r.total)}</div>
                    <div class="grid grid-cols-3 gap-2 text-center">
                        <div class="bg-green-50 rounded-xl py-2"><div class="text-lg font-black text-green-700">${r.entregados.length}</div><div class="text-[11px] text-neutral-600">Entregados</div></div>
                        <div class="bg-neutral-50 rounded-xl py-2"><div class="text-lg font-black">${r.entregados.length ? gs(Math.round(r.total / r.entregados.length)) : '-'}</div><div class="text-[11px] text-neutral-600">Ticket promedio</div></div>
                        <div class="bg-red-50 rounded-xl py-2"><div class="text-lg font-black text-red-700">${r.cancelados.length}</div><div class="text-[11px] text-neutral-600">Cancelados</div></div>
                    </div>
                    ${filas ? `<div class="border-t pt-2 space-y-1"><div class="text-xs font-semibold uppercase tracking-wider text-neutral-500">Pizzas vendidas: ${r.pizzas}</div>${filas}</div>` : ''}
                </div>`;
        }

        let gastos = [];
        let cancelarGastos = null;

        function escucharGastos() {
            const q = query(collection(db, 'gastos'), where('cierreId', '==', null));
            cancelarGastos = onSnapshot(q, (snap) => {
                gastos = snap.docs.map(d => ({ id: d.id, ...d.data({ serverTimestamps: 'estimate' }) }))
                    .sort((a, b) => (b.creado && b.creado.toMillis ? b.creado.toMillis() : 0) - (a.creado && a.creado.toMillis ? a.creado.toMillis() : 0));
                refrescarCaja();
            }, (error) => mostrarError('No se pudieron cargar los gastos: ' + error.message));
        }

        function refrescarCaja() {
            if (!$('modal-caja').classList.contains('hidden') && tabCaja === 'hoy' && !$('caja-contenido').querySelector('#btn-cerrar-caja:disabled')) renderCaja();
        }

        function bloqueTipos(pt) {
            const filas = Object.entries(TIPOS).map(([k, v]) => `<div class="flex justify-between text-sm"><span>${v.icono} ${v.label} <span class="text-xs text-neutral-500">(${(pt[k] && pt[k].n) || 0})</span></span><span class="font-semibold">${gs((pt[k] && pt[k].monto) || 0)}</span></div>`).join('');
            return `<div class="bg-white rounded-2xl border border-neutral-200 p-4 space-y-1.5"><div class="text-xs font-semibold uppercase tracking-wider text-neutral-500">Por tipo de pedido</div>${filas}</div>`;
        }

        function bloquePagos(pp, tg, total, fo) {
            const filas = Object.entries(PAGOS).map(([k, v]) => `<div class="flex justify-between text-sm"><span>${v.icono} ${v.label}</span><span class="font-semibold">${gs(pp[k] || 0)}</span></div>`).join('');
            const sin = pp.sinDefinir > 0 ? `<div class="flex justify-between text-sm text-amber-700"><span>⚠️ Sin forma de pago</span><span class="font-semibold">${gs(pp.sinDefinir)}</span></div>` : '';
            return `
                <div class="bg-white rounded-2xl border border-neutral-200 p-4 space-y-1.5">
                    <div class="text-xs font-semibold uppercase tracking-wider text-neutral-500">Por forma de pago</div>
                    ${filas}${sin}
                    <div class="border-t pt-2 mt-2 space-y-1">
                        ${fo > 0 ? `<div class="flex justify-between text-sm"><span>🏦 Fondo inicial</span><span class="font-semibold">+ ${gs(fo)}</span></div>` : ''}<div class="flex justify-between text-sm"><span>Gastos</span><span class="font-semibold text-red-700">− ${gs(tg)}</span></div>
                        <div class="flex justify-between text-sm"><span>💵 Efectivo esperado en caja</span><span class="font-bold">${gs((fo || 0) + (pp.efectivo || 0) - tg)}</span></div>
                        <div class="flex justify-between text-sm"><span>Ganancia (ventas − gastos)</span><span class="font-bold">${gs(total - tg)}</span></div>
                    </div>
                </div>`;
        }

        function bloqueGastos() {
            const lista = gastos.map(g => `<div class="flex items-center justify-between gap-2 text-sm border-b border-neutral-100 py-1"><span>${esc(g.concepto)}</span><span class="flex items-center gap-2"><span class="font-semibold">${gs(g.monto)}</span><button type="button" data-gasto-del="${esc(g.id)}" class="text-xs text-red-600 font-bold">✖</button></span></div>`).join('');
            return `
                <div class="bg-white rounded-2xl border border-neutral-200 p-4 space-y-2">
                    <div class="text-xs font-semibold uppercase tracking-wider text-neutral-500">Gastos del día</div>
                    <div class="flex gap-2">
                        <input id="gasto-concepto" type="text" maxlength="60" placeholder="Ej. Hielo" class="flex-1 min-w-0 bg-neutral-50 border border-neutral-300 rounded-xl px-3 py-2 text-sm">
                        <input id="gasto-monto" type="number" inputmode="numeric" min="1" placeholder="Gs" class="w-28 bg-neutral-50 border border-neutral-300 rounded-xl px-3 py-2 text-sm">
                        <button type="button" data-gasto-add class="bg-neutral-800 text-white text-sm font-bold px-3 rounded-xl">+</button>
                    </div>
                    ${lista || '<p class="text-xs text-neutral-500">Sin gastos anotados.</p>'}
                </div>`;
        }

        async function agregarGasto() {
            const concepto = $('gasto-concepto').value.trim();
            const monto = Math.round(Number($('gasto-monto').value));
            if (!concepto || !(monto > 0)) { mostrarError('Escribí el concepto y un monto mayor a 0.'); return; }
            try {
                $('gasto-concepto').value = ''; $('gasto-monto').value = '';
                await addDoc(collection(db, 'gastos'), { concepto: concepto, monto: monto, creado: serverTimestamp(), cierreId: null });
            } catch (e) {
                mostrarError('No se pudo guardar el gasto: ' + e.message);
            }
        }

        function resumenPagosTicket(c) {
            if (!c.porPago) return '';
            const pp = c.porPago;
            const gl = (c.gastos || []).map(g => `<div>- ${esc(g.concepto)}<div class="r">${gs(g.monto)}</div></div>`).join('');
            return `<div>Efectivo<div class="r">${gs(pp.efectivo)}</div></div>
  <div>Transferencia<div class="r">${gs(pp.transferencia)}</div></div>
  <div>POS<div class="r">${gs(pp.pos)}</div></div>
  ${pp.sinDefinir > 0 ? `<div>Sin definir<div class="r">${gs(pp.sinDefinir)}</div></div>` : ''}
  <hr>${gl}<div>GASTOS<div class="r">- ${gs(c.totalGastos)}</div></div>
  ${c.fondo ? `<div>FONDO INICIAL<div class="r">${gs(c.fondo)}</div></div>` : ''}<div>EFECTIVO EN CAJA<div class="r">${gs((c.fondo || 0) + (pp.efectivo || 0) - (c.totalGastos || 0))}</div></div>
  <hr>`;
        }

        function renderCaja() {
            const foco = document.activeElement && document.activeElement.id;
            const vc = $('gasto-concepto') ? $('gasto-concepto').value : '';
            const vm = $('gasto-monto') ? $('gasto-monto').value : '';
            const vf = $('caja-fondo') ? $('caja-fondo').value : null;
            document.querySelectorAll('.caja-tab').forEach(b => {
                b.className = 'caja-tab text-xs font-bold px-3 py-1.5 rounded-full ' + (b.dataset.tab === tabCaja ? 'bg-white text-neutral-900' : 'bg-white/20 text-white');
            });
            const cont = $('caja-contenido');
            if (tabCaja === 'hoy') {
                const r = resumenActual();
                const hayAlgo = r.entregados.length + r.cancelados.length + gastos.length > 0;
                cont.innerHTML = bloqueFondo() + bloqueResumen(r) + bloqueTipos(r.porTipo) + bloquePagos(r.porPago, r.totalGastos, r.total, fondo) + bloqueGastos() + bloqueComparar(r) + bloqueHoras(r) + bloqueExtra(r) + bloqueArqueo(r) +
                    (r.enCurso.length ? `<p class="text-sm text-amber-900 bg-amber-100 border border-amber-300 rounded-xl px-4 py-3">⚠️ Hay ${r.enCurso.length} pedido(s) en curso. No entran en este cierre: quedan en el panel para el próximo.</p>` : '') +
                    `<button type="button" id="btn-cerrar-caja" ${hayAlgo ? '' : 'disabled'} class="w-full bg-neutral-900 hover:bg-black disabled:opacity-40 text-white font-bold py-3 rounded-xl transition">🔒 Cerrar caja y limpiar panel</button>
                     <p class="text-xs text-neutral-500 text-center">Se guarda el reporte en el historial y los pedidos entregados y cancelados salen del panel.</p>`;
                if ($('gasto-concepto')) { $('gasto-concepto').value = vc; $('gasto-monto').value = vm; }
                if (vf !== null && $('caja-fondo')) $('caja-fondo').value = vf;
                if (foco && $(foco) && (foco === 'gasto-concepto' || foco === 'gasto-monto' || foco === 'caja-contado' || foco === 'caja-fondo')) $(foco).focus();
            } else {
                if (tabCaja === 'clientes') { cont.innerHTML = bloqueClientes(); return; }
                if (!cierres.length) {
                    cont.innerHTML = '<p class="text-center text-neutral-500 py-10">Todavía no hay cierres guardados.</p>';
                    return;
                }
                cont.innerHTML = bloqueHistorial() + cierresFiltrados().map(c => {
                    const filas = (c.pedidos || []).map(x => `<div class="flex justify-between gap-2 text-xs border-b border-neutral-100 py-1"><span>${esc(x.n)} · ${esc(x.nombre)}${x.estado === 'cancelado' ? ' <em class="text-red-600">(cancelado)</em>' : ''}</span><span class="font-semibold">${gs(x.total)}</span></div>`).join('');
                    return `
                    <details class="bg-white rounded-2xl border border-neutral-200 p-4">
                        <summary class="cursor-pointer flex justify-between items-center gap-2">
                            <span class="font-bold">${c.nro ? 'Cierre #' + esc(c.nro) + ' · ' : ''}${esc(c.fecha)} <span class="text-xs font-normal text-neutral-500">· ${esc(c.cantidadEntregados)} pedidos</span></span>
                            <span class="font-black text-red-700">${gs(c.total)}</span>
                        </summary>
                        <div class="mt-3 space-y-2">
                            <div class="text-xs text-neutral-500">Cerrado ${esc(fechaCorta(c.cerradoMs))} por ${esc(c.cerradoPor)} · Cancelados: ${esc(c.cantidadCancelados)} · Pizzas: ${esc(c.pizzas)}</div>
                            ${(c.porTamano || []).map(t => `<div class="flex justify-between text-sm"><span>${esc(t.cantidad)} × ${esc(t.nombre)}</span><span>${gs(t.monto)}</span></div>`).join('')}
                            ${c.porTipo ? bloqueTipos(c.porTipo) : ''}${c.porPago ? bloquePagos(c.porPago, c.totalGastos || 0, c.total, c.fondo || 0) : ''}${bloqueHoras(c)}${bloqueExtra(c)}${difHtml(c)}
                            <div class="border-t pt-2">${filas}</div>
                            <button type="button" data-imprimir-cierre="${esc(c.id)}" class="text-xs bg-blue-100 hover:bg-blue-200 text-blue-800 font-bold px-3 py-2 rounded-xl">🖨️ Imprimir reporte</button>
                        </div>
                    </details>`;
                }).join('');
            }
        }

        async function cargarCierres() {
            $('caja-contenido').innerHTML = '<p class="text-center text-neutral-500 py-10">Cargando...</p>';
            try {
                const snap = await getDocs(query(collection(db, 'cierres'), orderBy('cerrado', 'desc'), limit(200)));
                cierres = snap.docs.map(d => {
                    const x = d.data();
                    return { id: d.id, ...x, cerradoMs: x.cerrado && x.cerrado.toMillis ? x.cerrado.toMillis() : Date.now() };
                });
            } catch (e) {
                mostrarError('No se pudo cargar el historial: ' + e.message);
                cierres = [];
            }
            renderCaja();
        }

        async function cerrarCaja() {
            if (esDelivery) return;
            const r = resumenActual();
            const aArchivar = [...r.entregados, ...r.cancelados];
            if (!aArchivar.length && !gastos.length) return;
            if (aArchivar.length + gastos.length > 450) { mostrarError('Son demasiados pedidos para un solo cierre.'); return; }
            if (!confirm('¿Cerrar la caja?\n\nTotal: ' + gs(r.total) + '\nEntregados: ' + r.entregados.length + ' · Cancelados: ' + r.cancelados.length +
                '\nGastos: ' + gs(r.totalGastos) + '\n\nSe guarda el reporte y estos pedidos salen del panel.')) return;
            const btn = $('btn-cerrar-caja');
            if (btn) { btn.disabled = true; btn.textContent = 'Guardando...'; }
            try {
                const restante = r.enCurso.reduce((m, p) => Math.max(m, Number(p.numero || 0)), 0);
                const esperado = efectivoEsperado(r);
                const contado = contadoTmp === '' ? null : Math.round(Number(contadoTmp));
                const cs = await getDoc(refContador());
                const nroCierre = ((cs.exists() && cs.data().cierres) || 0) + 1;
                const ms = aArchivar.map(creadoMs);
                const ref = doc(collection(db, 'cierres'));
                const batch = writeBatch(db);
                batch.set(ref, {
                    cerrado: serverTimestamp(),
                    cerradoPor: (auth.currentUser && auth.currentUser.email) || '',
                    fecha: new Date().toLocaleDateString('es-PY', { weekday: 'long', day: '2-digit', month: '2-digit', year: 'numeric' }),
                    desde: ms.length ? Math.min(...ms) : Date.now(),
                    hasta: ms.length ? Math.max(...ms) : Date.now(),
                    total: r.total,
                    porPago: r.porPago,
                    porTipo: r.porTipo,
                    totalGastos: r.totalGastos,
                    gastos: gastos.map(g => ({ concepto: String(g.concepto || ''), monto: Number(g.monto || 0) })),
                    efectivoEsperado: esperado,
                    fondo: fondo,
                    ganancia: r.total - r.totalGastos,
                    nro: nroCierre,
                    efectivoContado: contado,
                    diferencia: contado === null ? null : contado - esperado,
                    topSabores: r.topSabores,
                    horaPico: r.horaPico,
                    porHora: r.porHora,
                    cantidadEntregados: r.entregados.length,
                    cantidadCancelados: r.cancelados.length,
                    pizzas: r.pizzas,
                    porTamano: r.porTamano,
                    pedidos: aArchivar.map(p => ({
                        n: numeroCorto(p), numero: Number(p.numero || 0),
                        hora: creadoMs(p),
                        nombre: String((p.cliente && p.cliente.nombre) || ''),
                        total: Number(p.total || 0),
                        estado: estadoDe(p)
                    }))
                });
                batch.set(refContador(), { ultimo: restante, cierres: nroCierre, fondo: 0 }, { merge: true });
                aArchivar.forEach(p => batch.update(doc(db, 'pedidos', p.id), { estado: 'archivado', cierreId: ref.id, estadoActualizado: serverTimestamp() }));
                gastos.forEach(g => batch.update(doc(db, 'gastos', g.id), { cierreId: ref.id }));
                await batch.commit();
                cargarUltimos(); contadoTmp = ''; mostrarToast('🔒 Caja cerrada · el próximo pedido será #' + (restante + 1)); tabCaja = 'historial';
                await cargarCierres();
            } catch (e) {
                mostrarError('No se pudo cerrar la caja: ' + e.message);
                renderCaja();
            }
        }

        function imprimirCierre(c) {
            const filas = (c.pedidos || []).map(x => `<div>${esc(x.n)} ${esc(x.nombre)}${x.estado === 'cancelado' ? ' (CANCELADO)' : ''}<div class="r">${gs(x.total)}</div></div>`).join('');
            const tam = (c.porTamano || []).map(t => `<div>${esc(t.cantidad)} x ${esc(t.nombre)}<div class="r">${gs(t.monto)}</div></div>`).join('');
            const html = `<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><title>Cierre ${esc(c.fecha)}</title>
<style>
  @page { size: 80mm auto; margin: 3mm; }
  body { font-family: "Courier New", Courier, monospace; font-size: 12px; width: 72mm; margin: 0 auto; color: #000; }
  .c { text-align: center; } h1 { font-size: 18px; margin: 0; }
  hr { border: 0; border-top: 1px dashed #000; margin: 6px 0; }
  .r { text-align: right; } .total { font-size: 16px; font-weight: bold; text-align: right; }
  @media screen { body { padding: 10px; } }
</style></head><body>
  <div class="c"><h1>${esc(NOMBRE_LOCAL)}</h1><div><strong>CIERRE DE CAJA${c.nro ? ' #' + esc(c.nro) : ''}</strong></div><div>${esc(c.fecha)}</div></div>
  <hr>${tam}<hr>${filas}<hr>${resumenPagosTicket(c)}${ticketExtra(c)}
  <div>Entregados: ${esc(c.cantidadEntregados)} · Cancelados: ${esc(c.cantidadCancelados)}</div>
  <div class="total">TOTAL: ${gs(c.total)}</div>
  <script>window.onload = function () { window.focus(); window.print(); };
  window.onafterprint = function () { window.close(); };<\/script>
</body></html>`;
            const w = window.open('', '_blank', 'width=420,height=640');
            if (!w) { mostrarError('El navegador bloqueó la ventana de impresión.'); return; }
            w.document.open(); w.document.write(html); w.document.close();
        }

        $('btn-caja').addEventListener('click', () => {
            if (esDelivery) return;
            tabCaja = 'hoy';
            $('modal-caja').classList.remove('hidden');
            renderCaja();
        });
        $('modal-caja').addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && (e.target.id === 'gasto-concepto' || e.target.id === 'gasto-monto')) { e.preventDefault(); agregarGasto(); }
        });
        $('caja-cerrar-modal').addEventListener('click', () => $('modal-caja').classList.add('hidden'));
        $('modal-caja').addEventListener('click', (e) => {
            const t = e.target.closest('[data-tab]');
            if (t) {
                tabCaja = t.dataset.tab;
                if (tabCaja === 'historial') cargarCierres(); else renderCaja();
                return;
            }
            const rg = e.target.closest('[data-rango]');
            if (rg) { rangoHist = Number(rg.dataset.rango); renderCaja(); return; }
            if (e.target.closest('[data-csv]')) { descargarCSV(); return; }
            if (e.target.closest('[data-fondo-guardar]')) { guardarFondo(); return; }
            const ce = e.target.closest('[data-cli-edit]');
            if (ce) { abrirCliente(ce.dataset.cliEdit); return; }
            if (e.target.closest('[data-cli-nuevo]')) { abrirCliente(null); return; }
            if (e.target.closest('#btn-cerrar-caja')) { cerrarCaja(); return; }
            if (e.target.closest('[data-gasto-add]')) { agregarGasto(); return; }
            const gd = e.target.closest('[data-gasto-del]');
            if (gd) {
                if (confirm('¿Borrar este gasto?')) deleteDoc(doc(db, 'gastos', gd.dataset.gastoDel)).catch(err => mostrarError('No se pudo borrar: ' + err.message));
                return;
            }
            const im = e.target.closest('[data-imprimir-cierre]');
            if (im) {
                const c = cierres.find(x => x.id === im.dataset.imprimirCierre);
                if (c) imprimirCierre(c);
            }
        });

        // ===== Número de pedido: arranca en 1 y vuelve a 0 al cerrar la caja =====
        const refContador = () => doc(db, 'config', 'contador');
        let asignando = false;
        async function asignarNumeros() {
            if (esDelivery || asignando) return;
            const faltan = pedidos.filter(p => !p.numero).sort((a, b) => creadoMs(a) - creadoMs(b));
            if (!faltan.length) return;
            asignando = true;
            try {
                for (const p of faltan) {
                    const hecho = await runTransaction(db, async (tx) => {
                        const [c, d] = await Promise.all([tx.get(refContador()), tx.get(doc(db, 'pedidos', p.id))]);
                        if (!d.exists() || d.data().numero) return false;
                        const n = ((c.exists() && c.data().ultimo) || 0) + 1;
                        tx.set(refContador(), { ultimo: n }, { merge: true });
                        tx.update(d.ref, { numero: n });
                        return true;
                    });
                    if (hecho) recordarCliente(p);
                }
            } catch (e) { mostrarError('No se pudo numerar los pedidos: ' + e.message); }
            asignando = false;
        }

        // ===== Clientes frecuentes (memoria solo del panel: la colección "clientes" es solo del administrador) =====
        let clientesMem = [], cancelarClientes = null;
        const celLocal = (c) => '0' + String(c.celular).slice(3);
        function escucharClientes() {
            cancelarClientes = onSnapshot(query(collection(db, 'clientes'), orderBy('ultimo', 'desc'), limit(500)), (snap) => {
                clientesMem = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                $('dl-nombres').innerHTML = clientesMem.map(c => `<option value="${esc(c.nombre)}" label="${esc(celLocal(c))}"></option>`).join('');
                $('dl-cels').innerHTML = clientesMem.map(c => `<option value="${esc(celLocal(c))}" label="${esc(c.nombre)}"></option>`).join('');
                if (!$('modal-caja').classList.contains('hidden') && tabCaja === 'clientes') renderCaja();
            }, () => {});
        }
        async function recordarCliente(p) {
            const c = p.cliente || {}, cel = waNumero(c.celular);
            if (cel.length !== 12 || !c.nombre) return;
            const d = { nombre: c.nombre, celular: cel, ultimo: serverTimestamp(), pedidos: increment(1), gastado: increment(Number(p.total || 0)) };
            if (c.direccion) d.direccion = c.direccion;
            try { await setDoc(doc(db, 'clientes', cel), d, { merge: true }); } catch (e) {}
        }
        function autoCliente(porCel) {
            const nom = $('nuevo-nombre').value.trim().toLowerCase(), cel = waNumero($('nuevo-celular').value);
            const c = porCel ? clientesMem.find(x => x.id === cel) : clientesMem.find(x => String(x.nombre).toLowerCase() === nom);
            if (!c) return;
            if (!$('nuevo-nombre').value.trim()) $('nuevo-nombre').value = c.nombre;
            if (!$('nuevo-celular').value.trim()) $('nuevo-celular').value = celLocal(c);
            if (c.direccion && !$('nuevo-direccion').value.trim()) $('nuevo-direccion').value = c.direccion;
        }
        $('nuevo-nombre').addEventListener('change', () => autoCliente(false));
        $('nuevo-celular').addEventListener('input', () => { if (waNumero($('nuevo-celular').value).length === 12) autoCliente(true); });

        // ===== Cierre avanzado: arqueo, top sabores, hora pico, resumen del historial y CSV =====
        let contadoTmp = '', rangoHist = 30;
        function textoDif(v, esp) {
            if (v === '') return '';
            const d = Math.round(Number(v)) - esp;
            return d === 0 ? '✅ La caja cuadra' : (d > 0 ? '⬆️ Sobran ' : '⬇️ Faltan ') + gs(Math.abs(d));
        }
        function bloqueArqueo(r) {
            return `<div class="bg-white rounded-2xl border border-neutral-200 p-4 space-y-2">
                <div class="text-xs font-semibold uppercase tracking-wider text-neutral-500">🧮 Arqueo de caja (opcional)</div>
                <div class="flex items-center justify-between gap-3"><label for="caja-contado" class="text-sm font-semibold">Efectivo contado (Gs)</label>
                <input id="caja-contado" type="number" inputmode="numeric" min="0" value="${esc(contadoTmp)}" placeholder="0" class="w-36 bg-neutral-50 border border-neutral-300 rounded-xl px-3 py-2 text-sm text-right"></div>
                <div id="caja-dif" class="text-sm font-bold">${textoDif(contadoTmp, efectivoEsperado(r))}</div></div>`;
        }
        $('modal-caja').addEventListener('input', (e) => {
            if (e.target.id !== 'caja-contado') return;
            contadoTmp = e.target.value;
            const r = resumenActual();
            $('caja-dif').textContent = textoDif(contadoTmp, efectivoEsperado(r));
        });
        function bloqueExtra(c) {
            if (!(c.topSabores || []).length) return '';
            const h = c.horaPico ? `<div class="flex justify-between text-sm border-t pt-2 mt-2"><span>⏰ Hora pico</span><span class="font-semibold">${esc(c.horaPico.hora)}:00 hs · ${esc(c.horaPico.pedidos)} pedidos</span></div>` : '';
            return `<div class="bg-white rounded-2xl border border-neutral-200 p-4 space-y-1.5"><div class="text-xs font-semibold uppercase tracking-wider text-neutral-500">🏆 Sabores más pedidos</div>${c.topSabores.map((x, i) => `<div class="flex justify-between text-sm"><span>${i + 1}. ${esc(x.nombre)}</span><span class="font-semibold">${esc(x.cantidad)}</span></div>`).join('')}${h}</div>`;
        }
        function difHtml(c) {
            if (c.efectivoContado == null) return '';
            const d = Number(c.diferencia || 0);
            return `<div class="flex justify-between gap-2 text-sm bg-white rounded-2xl border border-neutral-200 p-4"><span>🧮 Contado: ${gs(c.efectivoContado)}</span><span class="font-bold ${d < 0 ? 'text-red-700' : 'text-green-700'}">${d === 0 ? 'Cuadra ✅' : (d > 0 ? 'Sobran ' : 'Faltan ') + gs(Math.abs(d))}</span></div>`;
        }
        function ticketExtra(c) {
            let t = '';
            if (c.efectivoContado != null) t += `<div>EFECTIVO CONTADO<div class="r">${gs(c.efectivoContado)}</div></div><div>${Number(c.diferencia) === 0 ? 'CAJA CUADRA' : (c.diferencia > 0 ? 'SOBRAN' : 'FALTAN')}<div class="r">${gs(Math.abs(c.diferencia || 0))}</div></div><hr>`;
            if ((c.topSabores || []).length) t += '<div>MAS PEDIDOS</div>' + c.topSabores.map((x, i) => `<div>${i + 1}. ${esc(x.nombre)} x${esc(x.cantidad)}</div>`).join('') + '<hr>';
            return t;
        }
        function cierresFiltrados() {
            return cierres.filter(c => !rangoHist || c.cerradoMs >= Date.now() - rangoHist * 86400000);
        }
        function bloqueHistorial() {
            const l = cierresFiltrados(), suma = (f) => l.reduce((a, c) => a + Number(f(c) || 0), 0);
            const ventas = suma(c => c.total), gast = suma(c => c.totalGastos), ped = suma(c => c.cantidadEntregados);
            const mejor = l.reduce((m, c) => (!m || c.total > m.total ? c : m), null);
            const caja = (k, v, cl) => `<div class="bg-neutral-50 rounded-xl py-2"><div class="text-base font-black ${cl || ''}">${v}</div><div class="text-[11px] text-neutral-600">${k}</div></div>`;
            const rg = [[7, '7 días'], [30, '30 días'], [0, 'Todo']].map(([v, t]) => `<button type="button" data-rango="${v}" class="text-xs font-bold px-3 py-1.5 rounded-full ${rangoHist === v ? 'bg-neutral-900 text-white' : 'bg-neutral-100 text-neutral-700'}">${t}</button>`).join('');
            return `<div class="bg-white rounded-2xl border border-neutral-200 p-4 space-y-3">
                <div class="flex items-center justify-between gap-2"><div class="flex gap-2">${rg}</div><button type="button" data-csv class="text-xs bg-green-100 hover:bg-green-200 text-green-800 font-bold px-3 py-1.5 rounded-xl">⬇️ CSV</button></div>
                <div class="grid grid-cols-3 gap-2 text-center">${caja('Ventas', gs(ventas), 'text-red-700')}${caja('Gastos', gs(gast))}${caja('Ganancia', gs(ventas - gast), 'text-green-700')}${caja('Pedidos', ped)}${caja('Promedio por cierre', l.length ? gs(Math.round(ventas / l.length)) : '-')}${caja('Mejor día', mejor ? gs(mejor.total) : '-')}</div>
                <div class="text-xs text-neutral-500 text-center">${l.length} cierre(s) en este período</div></div>`;
        }
        function descargarCSV() {
            const q = (v) => '"' + String(v ?? '').replace(/"/g, '""') + '"';
            const filas = cierresFiltrados().map(c => { const p = c.porPago || {}; return [c.nro || '', c.fecha, c.cantidadEntregados, c.cantidadCancelados, c.total, c.totalGastos || 0, c.total - (c.totalGastos || 0), p.efectivo || 0, p.transferencia || 0, p.pos || 0, c.efectivoContado ?? '', c.diferencia ?? ''].map(q).join(';'); });
            const csv = ['Cierre;Fecha;Entregados;Cancelados;Ventas;Gastos;Ganancia;Efectivo;Transferencia;POS;Contado;Diferencia', ...filas].join('\n');
            const a = document.createElement('a');
            a.href = URL.createObjectURL(new Blob(['\ufeff' + csv], { type: 'text/csv;charset=utf-8' }));
            a.download = 'cierres-mi-barrio.csv';
            a.click();
        }

        
        // ===== TPV: fondo de caja =====
        let fondo = 0, cancelarFondo = null;
        function escucharFondo() {
            cancelarFondo = onSnapshot(refContador(), (snap) => {
                fondo = Number((snap.exists() && snap.data().fondo) || 0);
                refrescarCaja();
            }, () => {});
        }
        const efectivoEsperado = (r) => fondo + r.porPago.efectivo - r.totalGastos;
        function bloqueFondo() {
            return `<div class="bg-white rounded-2xl border border-neutral-200 p-4 space-y-2">
                <div class="text-sm font-bold">🏦 Fondo inicial (cambio con el que abrís)</div>
                <div class="flex gap-2">
                    <input id="caja-fondo" type="number" inputmode="numeric" min="0" value="${fondo || ''}" placeholder="0" class="flex-1 min-w-0 bg-neutral-50 border border-neutral-300 rounded-xl px-3 py-2 text-sm text-right">
                    <button type="button" data-fondo-guardar class="bg-neutral-800 text-white text-sm font-bold px-4 rounded-xl">Guardar</button>
                </div>
                <p class="text-xs text-neutral-500">Se suma al efectivo esperado y se reinicia al cerrar la caja.</p></div>`;
        }
        async function guardarFondo() {
            const v = Math.max(0, Math.round(Number($('caja-fondo').value) || 0));
            try {
                await setDoc(refContador(), { fondo: v }, { merge: true });
                mostrarToast('🏦 Fondo inicial: ' + gs(v));
            } catch (e) { mostrarError('No se pudo guardar el fondo: ' + e.message); }
        }

        // ===== TPV: cobro con vuelto =====
        let cobro = null;
        const BILLETES = [10000, 20000, 50000, 100000, 200000];
        function cobroInfoHtml(p) {
            const m = PAGOS[p.pago];
            return `<div class="text-sm font-bold text-green-700">✅ Cobrado${m ? ' · ' + m.icono + ' ' + m.label : ''}${p.recibido ? ' · recibido ' + gs(p.recibido) + ' · vuelto ' + gs(p.vuelto || 0) : ''}</div>`;
        }
        function pedidoCobro() { return cobro ? pedidos.find(x => x.id === cobro.id) : null; }
        function abrirCobro(p) {
            const e = estadoDe(p);
            const puede = (TRANSICIONES[e] || []).includes('entregado');
            cobro = { id: p.id, metodo: PAGOS[p.pago] ? p.pago : 'efectivo', recibido: 0, puedeEntregar: puede,
                      entregar: puede && (e === 'en_camino' || p.tipo === 'retiro' || p.tipo === 'local'), imprimir: true, guardando: false };
            $('modal-cobro').classList.remove('hidden');
            renderCobro();
        }
        function cerrarCobro() { cobro = null; $('modal-cobro').classList.add('hidden'); }
        function textoVuelto(total) {
            const rec = cobro.recibido;
            if (!rec) return '<span class="text-neutral-500">Tocá un billete o escribí lo que te dan</span>';
            if (rec < total) return '<span class="text-red-700">Faltan ' + gs(total - rec) + '</span>';
            return rec === total ? '<span class="text-green-700">Justo ✅</span>' : '<span class="text-green-700">Vuelto: ' + gs(rec - total) + '</span>';
        }
        function renderCobro() {
            const p = pedidoCobro();

            const total = Number(p.total || 0), efec = cobro.metodo === 'efectivo';
            $('cobro-titulo').textContent = '💰 Cobrar ' + numeroCorto(p);
            const metodos = Object.entries(PAGOS).map(([k, v]) =>

            const efectivoHtml = efec ? `
                <div class="bg-white rounded-2xl border border-neutral-200 p-4 space-y-3">

                    <input id="cobro-recibido" type="number" inputmode="numeric" min="0" value="${cobro.recibido || ''}" placeholder="0" class="w-40 bg-neutral-50 border border-neutral-300 rounded-xl px-3 py-2 text-lg text-right font-bold"></div>
                    <div class="flex flex-wrap gap-1.5"><button type="button" data-c-monto="exacto" class="text-xs font-bold px-3 py-2 rounded-xl border ${clsOff}">Justo</button>${BILLETES.map(b => `<button type="button" data-c-monto="${b}" class="text-xs font-bold px-3 py-2 rounded-xl border ${cobro.recibido === b ? clsOn : clsOff}">${b / 1000} mil</button>`).join('')}</div>
                    <div id="cobro-vuelto" class="text-xl font-black text-center">${textoVuelto(total)}</div>
                </div>` : '';
            $('cobro-cuerpo').innerHTML = `
                <div class="text-center"><div class="text-sm text-neutral-600">${esc((p.cliente && p.cliente.nombre) || '')}</div><div class="text-4xl font-black text-red-700">${gs(total)}</div></div>
                <div class="grid grid-cols-3 gap-2">${metodos}</div>
                ${efectivoHtml}
                <div class="space-y-2 text-sm">
                    ${cobro.puedeEntregar ? `<label class="flex items-center gap-2"><input id="cobro-entregar" type="checkbox" ${cobro.entregar ? 'checked' : ''}> Marcar como entregado</label>` : ''}
                    <label class="flex items-center gap-2"><input id="cobro-imprimir" type="checkbox" ${cobro.imprimir ? 'checked' : ''}> Imprimir ticket</label>
                </div>
                <button id="cobro-confirmar" type="button" class="w-full bg-green-600 hover:bg-green-700 disabled:opacity-50 text-white font-bold py-3.5 rounded-xl transition">✅ Confirmar cobro</button>`;
            if (efec) { const i = $('cobro-recibido'); if (i && !('ontouchstart' in window)) i.focus(); }
        }
        async function confirmarCobro() {
            const p = pedidoCobro();
            if (!p || cobro.guardando) return;
            const total = Number(p.total || 0), efec = cobro.metodo === 'efectivo';
            const rec = efec ? (cobro.recibido || total) : total;
            if (efec && rec < total) { mostrarToast('Faltan ' + gs(total - rec) + ' para completar el cobro'); return; }
            const vuelto = efec ? rec - total : 0;
            const upd = { pago: cobro.metodo, pagado: true, cobradoEn: serverTimestamp(), recibido: efec ? rec : null, vuelto: efec ? vuelto : null };
            const entregar = cobro.puedeEntregar && cobro.entregar;
            if (entregar) { upd.estado = 'entregado'; upd.estadoActualizado = serverTimestamp(); }
            if (cobro.imprimir) imprimirTicket({ ...p, pago: upd.pago, pagado: true, recibido: upd.recibido, vuelto: upd.vuelto });
            cobro.guardando = true;
            $('cobro-confirmar').disabled = true;
            try {
                await updateDoc(doc(db, 'pedidos', p.id), upd);
                cerrarCobro();
                mostrarToast('✅ Cobrado ' + numeroCorto(p) + ' · ' + gs(total) + (vuelto ? ' · vuelto ' + gs(vuelto) : ''));
            } catch (e) {
                if (cobro) { cobro.guardando = false; $('cobro-confirmar').disabled = false; }
                mostrarError('No se pudo registrar el cobro: ' + e.message);
            }
        }
        $('modal-cobro').addEventListener('click', (e) => {
            if (e.target === $('modal-cobro')) { cerrarCobro(); return; }
            const b = e.target.closest('button');
            if (!b || !cobro) return;
            const d = b.dataset, p = pedidoCobro();
            if (b.id === 'cobro-cerrar') { cerrarCobro(); return; }
            if (b.id === 'cobro-confirmar') { confirmarCobro(); return; }
            if (d.cMetodo) { cobro.metodo = d.cMetodo; cobro.recibido = 0; }
            else if (d.cMonto && p) { cobro.recibido = d.cMonto === 'exacto' ? Number(p.total || 0) : Number(d.cMonto); }
            else return;
            renderCobro();
        });
        $('modal-cobro').addEventListener('input', (e) => {
            const p = pedidoCobro();

        // ===== TPV: venta rápida (mostrador, efectivo, ya entregada) =====
        $('btn-rapida').addEventListener('click', () => {

        // ===== TPV: comanda de cocina (sin precios) =====
        function htmlComanda(p, etiqueta, conScript) {
            const c = p.cliente || {};
            const tipo = TIPOS[p.tipo] ? TIPOS[p.tipo].label.toUpperCase() : 'DELIVERY';
            const pizzas = (p.pizzas || []).map((z, i) => `<div class="item"><div class="t">${i + 1}. ${esc(z.nombre)}</div><div class="s">${esc((z.sabores || []).join(' / '))}</div>${z.borde ? '<div class="t">** BORDE RELLENO **</div>' : ''}</div>`).join('');
            const extras = (p.extras || []).map(x => `<div class="t">+ ${esc(x.item)} x${esc(x.cantidad)}</div>`).join('');
            const html = `<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><title>Comanda ${esc(numeroCorto(p))}</title>
<style>
  @page { size: 80mm auto; margin: 3mm; }
  body { font-family: "Courier New", Courier, monospace; font-size: 14px; width: 72mm; margin: 0 auto; color: #000; }
  .c { text-align: center; } .n { font-size: 34px; font-weight: bold; }
  hr { border: 0; border-top: 2px dashed #000; margin: 8px 0; }
  .item { margin-bottom: 10px; } .t { font-weight: bold; font-size: 16px; } .s { font-size: 15px; }
  @media screen { body { padding: 10px; } }
</style></head><body>
  <div class="c"><div>${esc(etiqueta || 'COCINA')}</div><div class="n">${esc(numeroCorto(p))}</div><div class="t">${esc(tipo)}</div><div>${esc(fechaCorta(creadoMs(p)))} · ${esc(c.nombre)}</div></div>
  <hr>${pizzas}${extras ? '<hr>' + extras : ''}
  ${c.notas ? `<hr><div class="t">NOTA: ${esc(c.notas)}</div>` : ''}
  ${conScript ? '<script>window.onload = function () { window.focus(); window.print(); }; window.onafterprint = function () { window.close(); };<\/script>' : ''}
</body></html>`;
            return html;
        }
        function imprimirComanda(p, etiqueta) {
            const html = htmlComanda(p, etiqueta, true);
            const w = window.open('', '_blank', 'width=420,height=640');
            if (!w) { mostrarError('El navegador bloqueó la ventana de impresión.'); return; }
            w.document.open(); w.document.write(html); w.document.close();
        }
        // Impresión automática: usa un marco oculto (no abre ventanas, así el navegador no la bloquea)
        function imprimirComandaAuto(p) {
            const f = document.createElement('iframe');
            f.style.cssText = 'position:fixed;right:0;bottom:0;width:0;height:0;border:0;visibility:hidden';
            f.onload = () => {
                try { f.contentWindow.focus(); f.contentWindow.print(); }
                catch (e) { mostrarError('No se pudo imprimir la comanda automática: ' + e.message); }
                setTimeout(() => f.remove(), 60000);
            };
            document.body.appendChild(f);
            f.srcdoc = htmlComanda(p, 'COCINA', false);
        }

        
        // ===== TPV 2: pantalla de cocina =====

                    <div>${pizzas}${extras}</div>

                    <button type="button" data-cocina="${sig}" data-id="${esc(p.id)}" class="w-full ${e === 'nuevo' ? 'bg-green-600 hover:bg-green-700' : 'bg-blue-600 hover:bg-blue-700'} text-white font-extrabold text-lg py-3 rounded-xl">${e === 'nuevo' ? '👨‍🍳 Empezar' : '✅ Listo'}</button>
                </article>`;

        $('btn-cocina').addEventListener('click', () => { $('vista-cocina').classList.remove('hidden'); renderCocina(); });
        $('cocina-cerrar').addEventListener('click', () => $('vista-cocina').classList.add('hidden'));
        $('cocina-lista').addEventListener('click', (e) => {

        // ===== TPV 2: agregar a un pedido abierto (mesa) =====
        $('btn-nuevo').addEventListener('click', () => { nuevo.agregarA = null; });
        function abrirAgregar(p) {
            nuevoLimpiar();
            if (p.estado === 'entregado' || p.pagado) { toast('⚠️ El pedido ' + numeroCorto(p) + ' ya fue cobrado/entregado: no se puede agregar más. Creá un nuevo pedido.'); return; }
            nuevo.agregarA = p.id; nuevo.tipo = TIPOS[p.tipo] ? p.tipo : 'delivery'; nuevo.entrada = 'nuevo';
            nuevoMsg('nuevo-error', '');

            nuevoMsg('nuevo-ok', '➕ Agregando al pedido ' + numeroCorto(p) + ' · ' + ((p.cliente && p.cliente.nombre) || '') + '. Lo que sumes entra al total y sale una comanda solo con lo agregado.');
        }
        async function guardarAgregado() {
            const n = nuevo, p = pedidos.find(x => x.id === n.agregarA);
            if (!p || n.guardando) { nuevoMsg('nuevo-error', 'No se encontró el pedido.'); return; }
            if (p.estado === 'entregado' || p.pagado) { nuevoMsg('nuevo-error', 'El pedido ' + numeroCorto(p) + ' ya fue cobrado/entregado: no se puede agregar más productos. Creá un nuevo pedido.'); return; }
            nuevoMsg('nuevo-ok', ''); nuevoMsg('nuevo-error', '');
            if (n.sabores.length) { nuevoMsg('nuevo-error', 'Tenés sabores elegidos sin agregar. Tocá "＋ Agregar pizza" o desmarcalos.'); return; }
            const extrasN = MENU.extras.filter(x => (n.extras[x[0]] || 0) > 0).map(x => ({ item: x[1], cantidad: n.extras[x[0]] }));
            if (!n.pizzas.length && !extrasN.length) { nuevoMsg('nuevo-error', 'Agregá al menos una pizza o un extra.'); return; }
            const pizzasN = n.pizzas.map(z => ({ tamano: z.tamano, nombre: MENU.tamanos[z.tamano].nombre, sabores: z.sabores, borde: !!z.borde, precio: z.precio }));
            const suma = pizzasN.reduce((a, z) => a + z.precio, 0) + MENU.extras.reduce((a, x) => a + (n.extras[x[0]] || 0) * x[2], 0);
            const extras = (p.extras || []).map(x => ({ ...x }));
            extrasN.forEach(x => { const f = extras.find(y => y.item === x.item); if (f) f.cantidad = Number(f.cantidad) + x.cantidad; else extras.push({ ...x }); });
            imprimirComanda({ ...p, pizzas: pizzasN, extras: extrasN }, 'AGREGADO');
            n.guardando = true; $('nuevo-guardar').disabled = true;
            try {
                await updateDoc(doc(db, 'pedidos', p.id), { pizzas: [...(p.pizzas || []), ...pizzasN], extras: extras, total: Number(p.total || 0) + suma });

                mostrarToast('➕ Agregado a ' + numeroCorto(p) + ' · total ' + gs(Number(p.total || 0) + suma));

                nuevoMsg('nuevo-error', 'No se pudo agregar: ' + e.message);

        // ===== TPV 2: pedidos por hora y comparación con cierres anteriores =====
        let ultimos = [];
        async function cargarUltimos() {
            try {
                const snap = await getDocs(query(collection(db, 'cierres'), orderBy('cerrado', 'desc'), limit(12)));
                ultimos = snap.docs.map(d => d.data());
                refrescarCaja();

        }
        function bloqueComparar(r) {
            if (!ultimos.length) return '';
            const dia = (f) => String(f || '').split(/[ ,]/)[0];
            const hoy = new Date().toLocaleDateString('es-PY', { weekday: 'long' });
            const ref = ultimos.find(c => dia(c.fecha) === hoy) || ultimos[0];
            const pct = Number(ref.total) > 0 ? Math.round((r.total - ref.total) / ref.total * 100) : null;
            const cl = pct === null ? '' : (pct >= 0 ? 'text-green-700' : 'text-red-700');
            return `<div class="bg-white rounded-2xl border border-neutral-200 p-4 space-y-1">
                <div class="text-xs font-semibold uppercase tracking-wider text-neutral-500">📈 Comparación</div>

                <div class="text-sm">Hasta ahora llevás <strong>${gs(r.total)}</strong>${pct === null ? '' : ` · <span class="font-bold ${cl}">${pct >= 0 ? '+' : ''}${pct}%</span>`}</div></div>`;
        }
        function bloqueHoras(c) {
            const h = c.porHora || {}, ks = Object.keys(h).map(Number).sort((a, b) => a - b);
            if (!ks.length) return '';

                filas += `<div class="flex items-center gap-2 text-xs"><span class="w-10 text-right text-neutral-500">${i}:00</span><div class="flex-1 bg-neutral-100 rounded"><div class="bg-red-600 rounded h-4" style="width:${Math.round(n / max * 100)}%"></div></div><span class="w-6 font-semibold">${n}</span></div>`;
            }
            return `<div class="bg-white rounded-2xl border border-neutral-200 p-4 space-y-1.5"><div class="text-xs font-semibold uppercase tracking-wider text-neutral-500">📊 Pedidos por hora</div>${filas}</div>`;
        }

                </div>`;

        // ===== Editar la base de clientes =====
        let editCli = null;

        function cerrarCliente() { editCli = null; $('modal-cliente').classList.add('hidden'); }
        async function guardarCliente() {
            if (!editCli) return;
            const err = (t) => { $('cli-error').textContent = t; $('cli-error').classList.remove('hidden'); };
            const nombre = $('cli-nombre').value.trim(), cel = waNumero($('cli-celular').value), direccion = $('cli-direccion').value.trim();
            if (!nombre) { err('Escribí el nombre.'); return; }
            if (cel.length !== 12) { err('Revisá el celular. Ejemplo: 0981 123 456'); return; }
            if (cel !== editCli.id && clientesMem.some(x => x.id === cel)) { err('Ya existe un cliente con ese celular.'); return; }
            const viejo = editCli.id ? clientesMem.find(x => x.id === editCli.id) : null;
            try {
                if (viejo && viejo.id === cel) {
                    await setDoc(doc(db, 'clientes', cel), { nombre: nombre, celular: cel, direccion: direccion }, { merge: true });

            const s = await getDocs(query(collection(db, 'cierres'), orderBy('cerrado', 'desc'), limit(500)));

        } catch (e) { $('cfg-vista').innerHTML = '<p class="text-red-700 text-center py-10">No se pudieron cargar los cierres: ' + esc(e.message) + '</p>'; return; }
    }
    if (tab !== 'reportes') return;
    const l = cierres.filter(c => !rango || c.ms >= Date.now() - rango * 86400000);
    const rg = [[7, '7 días'], [30, '30 días'], [90, '90 días'], [0, 'Todo']].map(([v, t]) => `<button type="button" data-rango="${v}" class="text-xs font-bold px-3 py-1.5 rounded-full ${rango === v ? 'bg-neutral-900 text-white' : 'bg-white border border-neutral-300'}">${t}</button>`).join('');

    const S = (f) => l.reduce((a, c) => a + Number(f(c) || 0), 0);
    const ventas = S(c => c.total), gastos = S(c => c.totalGastos), ped = S(c => c.cantidadEntregados);
    const dia = (f) => String(f || '').split(/[ ,]/)[0];
    const sem = {}, sab = {};
    l.forEach(c => { const d = dia(c.fecha); (sem[d] = sem[d] || []).push(Number(c.total || 0)); (c.topSabores || []).forEach(x => { sab[x.nombre] = (sab[x.nombre] || 0) + Number(x.cantidad || 0); }); });
    const semFilas = Object.entries(sem).map(([d, a]) => [d, Math.round(a.reduce((x, y) => x + y, 0) / a.length)]).sort((a, b) => b[1] - a[1]);
    const maxSem = semFilas[0][1] || 1;
    const top = Object.entries(sab).sort((a, b) => b[1] - a[1]).slice(0, 8);
    const dias = l.slice(0, 31).reverse(), maxD = Math.max(...dias.map(c => Number(c.total || 0)), 1);
    const caja = (k, v, cl) => `<div class="bg-neutral-50 rounded-xl py-2 text-center"><div class="text-base font-black ${cl || ''}">${v}</div><div class="text-[11px] text-neutral-600">${k}</div></div>`;
    const pp = (k) => S(c => c.porPago && c.porPago[k]), tp = (k) => S(c => c.porTipo && c.porTipo[k] && c.porTipo[k].monto);
    const fila = (a, b) => `<div class="flex justify-between text-sm"><span>${a}</span><span class="font-semibold">${b}</span></div>`;
    const barra = (a, v, max, b) => `<div class="flex items-center gap-2 text-xs"><span class="w-24 shrink-0 truncate text-neutral-600">${a}</span><div class="flex-1 bg-neutral-100 rounded"><div class="bg-red-600 rounded h-4" style="width:${Math.round(v / max * 100)}%"></div></div><span class="w-24 shrink-0 text-right font-semibold">${b}</span></div>`;
    $('cfg-vista').innerHTML = `
        <div class="flex items-center justify-between gap-2 flex-wrap"><div class="flex gap-2">${rg}</div><button type="button" id="rep-csv" class="text-xs bg-green-100 hover:bg-green-200 text-green-800 font-bold px-3 py-1.5 rounded-xl">⬇️ CSV</button></div>
        <div class="${CARD}"><div class="grid grid-cols-3 gap-2">${caja('Ventas', gs(ventas), 'text-red-700')}${caja('Gastos', gs(gastos))}${caja('Ganancia', gs(ventas - gastos), 'text-green-700')}${caja('Pedidos', ped)}${caja('Ticket promedio', ped ? gs(Math.round(ventas / ped)) : '-')}${caja('Cancelados', S(c => c.cantidadCancelados))}</div><div class="text-xs text-neutral-500 text-center">${l.length} cierre(s) en el período</div></div>
        <div class="${CARD}"><div class="${LBL}">Ventas por cierre</div>${dias.map(c => barra(esc(String(c.fecha || '').replace(/^[^,]*,\s*/, '')), Number(c.total || 0), maxD, gs(c.total))).join('')}</div>
        <div class="${CARD}"><div class="${LBL}">Promedio por día de la semana</div>${semFilas.map(([d, v]) => barra(esc(d), v, maxSem, gs(v))).join('')}</div>
        <div class="grid sm:grid-cols-2 gap-4">
            <div class="${CARD}"><div class="${LBL}">Por forma de pago</div>${fila('💵 Efectivo', gs(pp('efectivo')))}${fila('🏦 Transferencia', gs(pp('transferencia')))}${fila('💳 POS', gs(pp('pos')))}${fila('⚠️ Sin definir', gs(pp('sinDefinir')))}</div>
            <div class="${CARD}"><div class="${LBL}">Por tipo de pedido</div>${fila('🛵 Delivery', gs(tp('delivery')))}${fila('🛍️ Retiro', gs(tp('retiro')))}${fila('🍽️ En el local', gs(tp('local')))}</div>
        </div>
        ${top.length ? `<div class="${CARD}"><div class="${LBL}">Sabores más pedidos (suma de los top de cada cierre)</div>${top.map(([n, v], i) => fila((i + 1) + '. ' + esc(n), v)).join('')}</div>` : ''}`;
}
function csvReporte() {
    const q = (v) => '"' + String(v ?? '').replace(/"/g, '""') + '"';
    const l = cierres.filter(c => !rango || c.ms >= Date.now() - rango * 86400000);
    const filas = l.map(c => { const p = c.porPago || {}; return [c.nro || '', c.fecha, c.cantidadEntregados, c.cantidadCancelados, c.total, c.totalGastos || 0, (c.total || 0) - (c.totalGastos || 0), p.efectivo || 0, p.transferencia || 0, p.pos || 0, c.fondo || 0, c.efectivoContado ?? '', c.diferencia ?? ''].map(q).join(';'); });
    descargar('reporte-mi-barrio.csv', '\ufeff' + ['Cierre;Fecha;Entregados;Cancelados;Ventas;Gastos;Ganancia;Efectivo;Transferencia;POS;Fondo;Contado;Diferencia', ...filas].join('\n'), 'text/csv;charset=utf-8');
}
function descargar(nombre, texto, tipo) {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([texto], { type: tipo }));
    a.download = nombre; a.click();
}
