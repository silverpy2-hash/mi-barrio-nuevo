async function vistaDatos() {
    $('cfg-vista').innerHTML = `
        <div class="${CARD}"><div class="${LBL}">Lo que hay guardado</div><div id="d-conteo" class="space-y-1 text-sm">Contando...</div></div>
        <div class="${CARD}"><div class="${LBL}">Respaldo</div><p class="text-sm text-neutral-600">Descarga todo (pedidos, cierres, gastos, clientes y menú) en un archivo. Conviene hacerlo antes de borrar.</p><button type="button" id="d-backup" class="${BTN} bg-neutral-800 text-white">⬇️ Descargar respaldo</button></div>
        <div class="${CARD} border-red-200"><div class="${LBL} text-red-700">Zona de borrado</div><p class="text-sm text-neutral-600">No se puede deshacer. Te va a pedir que escribas BORRAR.</p>
            <button type="button" data-borrar="cierres" class="w-full ${BTN} bg-red-100 text-red-700 text-left">🗑️ Borrar historial de cierres</button>
            <button type="button" data-borrar="ventas" class="w-full ${BTN} bg-red-100 text-red-700 text-left">🗑️ Borrar toda la base de ventas (pedidos, gastos, cierres) y reiniciar numeración</button>
            <button type="button" data-borrar="clientes" class="w-full ${BTN} bg-red-100 text-red-700 text-left">🗑️ Borrar la memoria de clientes</button></div>`;
    const filas = [];
    for (const [c, t] of COLS) {
        try { filas.push(`<div class="flex justify-between"><span>${t}</span><span class="font-semibold">${(await getCountFromServer(collection(db, c))).data().count}</span></div>`); }
        catch (e) { filas.push(`<div class="flex justify-between"><span>${t}</span><span class="text-neutral-400">?</span></div>`); }
    }
    if ($('d-conteo')) $('d-conteo').innerHTML = filas.join('');
}
async function respaldo() {
    toast('Preparando respaldo...');
    try {
        const out = { generado: new Date().toISOString() };
        for (const [c] of COLS) out[c] = (await getDocs(collection(db, c))).docs.map(d => ({ id: d.id, ...d.data() }));
        out.menu = clone(draft);
        descargar('respaldo-mi-barrio-' + new Date().toISOString().slice(0, 10) + '.json', JSON.stringify(out), 'application/json');
        toast('✅ Respaldo descargado');
    } catch (e) { toast('No se pudo hacer el respaldo: ' + e.message); }
}
async function vaciar(nombre) {
    let n = 0;
    for (;;) {
        const s = await getDocs(query(collection(db, nombre), limit(400)));
        if (s.empty) break;
        const b = writeBatch(db); s.docs.forEach(d => b.delete(d.ref)); await b.commit(); n += s.size;
    }
    return n;
}
async function borrar(que) {
    const plan = { cierres: [['cierres'], 'el historial de cierres de caja'], ventas: [['pedidos', 'gastos', 'cierres'], 'TODOS los pedidos, gastos y cierres (la numeración vuelve a 0)'], clientes: [['clientes'], 'la memoria de clientes'] }[que];
    if (prompt('⚠️ Vas a borrar ' + plan[1] + '.\nNo se puede deshacer.\n\nEscribí BORRAR para confirmar:') !== 'BORRAR') return;
    toast('Borrando...');
    try {
        let total = 0;
        for (const c of plan[0]) total += await vaciar(c);
        if (que === 'ventas') await setDoc(doc(db, 'config', 'contador'), { ultimo: 0, cierres: 0, fondo: 0 }, { merge: true });
        if (que !== 'clientes') cierres = null; cargarUltimos();
        toast('🗑️ Listo: ' + total + ' registros borrados'); vistaDatos();
    } catch (e) { toast('No se pudo borrar todo: ' + e.message); }
}

// ===== 5. Horario del local (abierto / cerrado) =====
const ORDEN_DIAS = [1, 2, 3, 4, 5, 6, 0];
const TIME_CLS = 'bg-white border border-neutral-300 rounded-lg px-2 py-1.5 text-sm';
function pintaEstadoHorario() {
    const el = $('h-estado');
    if (!el || $('modal-config').classList.contains('hidden')) return;
    const e = estadoLocal(localCfg, Date.now());
    const modo = e.modo === 'manual' ? 'manual' + (e.hasta ? ' hasta las ' + fmtHora(e.hasta) : '') : e.modo === 'auto' ? 'siguiendo el horario' : 'sin horario automático (figura siempre abierto)';
    el.innerHTML = `<div class="${LBL}">Estado ahora</div>
        <div class="text-lg font-extrabold">${e.abierto ? '🟢 Abierto' : '🔴 Cerrado'} <span class="text-xs font-semibold text-neutral-500">· ${esc(modo)}</span></div>
        <div class="flex flex-wrap gap-2">
            <button type="button" data-hloc="abierto" class="${BTN} bg-green-600 hover:bg-green-700 text-white">🟢 Abrir ahora</button>
            <button type="button" data-hloc="cerrado" class="${BTN} bg-neutral-900 hover:bg-black text-white">🔴 Cerrar ahora</button>
            <button type="button" data-hloc="auto" class="${BTN} bg-white border border-neutral-300">↺ Volver a automático</button>
        </div>`;
}
window.refrescarHorarioUI = () => { if (tab === 'horario') pintaEstadoHorario(); else if (tab === 'apariencia') vistaApariencia(); };
function vistaHorario() {
    if (!hdraft) hdraft = clone(localCfg);
    const filas = ORDEN_DIAS.map(d => {
        const ts = hdraft.horarios[d] || [];
        return `<div class="${CARD}">
            <div class="flex items-center justify-between"><div class="font-bold">${DIAS_N[d]}</div><button type="button" data-hadd="${d}" class="text-xs font-bold px-3 py-1.5 rounded-lg bg-neutral-800 text-white">＋ Turno</button></div>
            ${ts.length ? ts.map((t, i) => `<div class="flex items-center gap-2 text-sm flex-wrap"><span>Abre</span><input type="time" data-hd="${d}" data-hi="${i}" data-hk="a" value="${esc(t.a)}" class="${TIME_CLS}"><span>cierra</span><input type="time" data-hd="${d}" data-hi="${i}" data-hk="c" value="${esc(t.c)}" class="${TIME_CLS}"><button type="button" data-hdel="${d}|${i}" class="text-red-600 font-bold px-2" title="Quitar turno">✖</button></div>`).join('') : '<p class="text-sm text-neutral-500">Cerrado todo el día</p>'}
        </div>`;
    }).join('');
    $('cfg-vista').innerHTML = `
        <div id="h-estado" class="${CARD}"></div>
        <div class="${CARD}">
            <label class="flex items-center gap-2 font-bold"><input id="h-auto" type="checkbox" ${hdraft.auto ? 'checked' : ''}> Abrir y cerrar solo, según este horario</label>
            <p class="text-xs text-neutral-500">Apagado: el local figura siempre abierto y lo manejás solo con el botón del panel. Un turno que cierra pasada la medianoche (por ejemplo 19:00 a 01:00) también funciona. Las horas son de Paraguay. El botón manual del panel manda hasta el próximo cambio del horario.</p>
        </div>
        <div class="${CARD}">
            <div class="${LBL}">Atajo: el mismo horario todos los días</div>
            <div class="flex items-center gap-2 text-sm flex-wrap"><input id="h-all-a" type="time" value="18:00" class="${TIME_CLS}"><span>a</span><input id="h-all-c" type="time" value="23:30" class="${TIME_CLS}"><button type="button" id="h-all" class="${BTN} bg-neutral-800 text-white">Aplicar a todos</button></div>
        </div>
        ${filas}
        <div class="${CARD}">
            <div class="${LBL}">Mensaje cuando estamos cerrados</div>
            <input id="h-msg" type="text" maxlength="140" value="${esc(hdraft.mensaje)}" placeholder="Por el momento no estamos tomando pedidos. ¡Te esperamos pronto!" class="w-full bg-white border border-neutral-300 rounded-lg px-2 py-1.5 text-sm">
            <p class="text-xs text-neutral-500">Debajo del mensaje, la página agrega sola "Abrimos hoy a las 18:00" cuando hay horario automático.</p>
        </div>
        <div class="flex gap-2 sticky bottom-3"><button type="button" id="h-guardar" class="flex-1 ${BTN} bg-red-700 hover:bg-red-800 text-white shadow-lg">💾 Guardar horario</button></div>`;
    pintaEstadoHorario();
}
// ===== 5. Mesas (QR por mesa) =====
function vistaMesas() {
    $('cfg-vista').innerHTML = `
        <div class="${CARD}"><div class="font-bold">🪑 Mesas y QR</div>
            <p class="text-xs text-neutral-500 mb-3">Agregá las mesas del local. Cada una tiene su QR que lleva directo a la página de pedidos con esa mesa ya cargada.</p>
            <div class="flex gap-2"><input id="mesa-nueva" type="number" min="1" inputmode="numeric" class="w-28 bg-white border border-neutral-300 rounded-lg px-2 py-1.5 text-sm" placeholder="Ej. 5"><button type="button" id="mesa-agregar" class="${BTN} bg-neutral-800 text-white">＋ Agregar</button></div>
            <div id="mesas-lista" class="grid grid-cols-2 sm:grid-cols-3 gap-3 mt-3"></div>
        </div>`;
    pintarMesas();
}
function pintarMesas() {
    const cont = $('mesas-lista');
    if (!cont) return;
    if (!mesas.length) { cont.innerHTML = '<p class="text-sm text-neutral-500">Todavía no tenés mesas cargadas.</p>'; return; }
    cont.innerHTML = mesas.map(n => `
        <div class="rounded-2xl border border-neutral-200 bg-white p-3 text-center">
            <img src="https://api.qrserver.com/v1/create-qr-code/?size=180x180&data=${encodeURIComponent(location.origin + location.pathname.replace(/[^/]*$/, '') + '?mesa=' + n)}" alt="QR mesa ${n}" class="w-40 h-40 mx-auto" />
            <div class="font-bold mt-2">Mesa ${n}</div>
            <button type="button" data-del-mesa="${n}" class="mt-2 text-xs font-bold bg-red-100 hover:bg-red-200 text-red-700 px-2 py-1 rounded-lg">🗑️ Borrar</button>
        </div>`).join('');
}
async function guardarMesas() {
    try { await setDoc(doc(db, 'config', 'mesas'), { mesas: mesas, actualizado: serverTimestamp() }, { merge: true }); toast('🪑 Mesas guardadas'); }
    catch (e) { toast('No se pudo guardar las mesas: ' + (e.code === 'permission-denied' ? 'falta publicar las reglas nuevas (reglas_firestore.txt).' : e.message)); }
}

// ===== 5. Apariencia (temas) =====
const TEMAS_CLIENTE = [
    ['clasico', 'Clásico', 'El diseño de siempre: simple y claro.', { bg: '#fcf8f2', top: '#000', a: '#b91c1c', card: '#fff', line: '#e5e5e5' }],
    ['bonito', 'Bonito', 'Fondo crema, toldo de pizzería, pasos numerados y tarjetas redondeadas.', { bg: '#fbf4ea', top: '#c8321f', a: '#c8321f', card: '#fff', line: '#ecdfce' }],
    ['noche', 'Noche', 'Misma estructura pero oscura, con naranja y dorado. Cómoda para pedir de noche.', { bg: '#14100d', top: '#ff6a3d', a: '#ff6a3d', card: '#271f19', line: '#3a2f27' }]
];
function miniTema(c) {
    return `<div style="background:${c.bg};border-radius:12px;overflow:hidden;border:1px solid ${c.line}">
        <div style="height:16px;background:${c.top}"></div>
        <div style="padding:8px;display:grid;gap:6px">
            <div style="height:8px;width:55%;border-radius:6px;background:${c.a}"></div>
            <div style="height:20px;border-radius:8px;background:${c.card};border:1px solid ${c.line}"></div>
            <div style="height:20px;border-radius:8px;background:${c.card};border:2px solid ${c.a}"></div>
            <div style="height:12px;width:70%;margin:0 auto;border-radius:8px;background:${c.a}"></div>
        </div></div>`;
}
function vistaApariencia() {
    const actual = (localCfg && localCfg.tema) || 'clasico';
    $('cfg-vista').innerHTML = `
        <div class="${CARD}">
            <div class="font-bold">🎨 Tema de la página de pedidos</div>
            <p class="text-xs text-neutral-500">Es lo que ven tus clientes. Se cambia al instante, sin volver a subir archivos. Podés usar <b>Probar</b> para verlo en otra pestaña antes de activarlo: ahí solo lo ves vos.</p>
            <div class="grid gap-3 sm:grid-cols-3">
                ${TEMAS_CLIENTE.map(([k, nombre, desc, c]) => `
                <div class="rounded-2xl border-2 p-3 space-y-2 ${actual === k ? 'border-green-600 bg-green-50' : 'border-neutral-200 bg-white'}">
                    ${miniTema(c)}
                    <div class="flex items-center justify-between gap-2"><div class="font-bold">${nombre}</div>${actual === k ? '<span class="text-[11px] font-extrabold text-green-700">✅ EN USO</span>' : ''}</div>
                    <p class="text-xs text-neutral-500">${desc}</p>
                    <div class="flex gap-2">
                        <a href="./?tema=${k}" target="_blank" rel="noopener" class="flex-1 text-center text-xs font-bold px-3 py-2 rounded-lg bg-white border border-neutral-300">👁️ Probar</a>
                        ${actual === k ? '' : `<button type="button" data-tema-cli="${k}" class="flex-1 text-xs font-bold px-3 py-2 rounded-lg bg-red-700 hover:bg-red-800 text-white">Usar este</button>`}
                    </div>
                </div>`).join('')}
            </div>
        </div>
        <div class="${CARD}">
            <div class="font-bold">🖥️ Tema del panel de control</div>
            <p class="text-xs text-neutral-500">Próxima pieza: el selector de tema para este panel (más cómodo en PC y celular) va a aparecer acá.</p>
        </div>`;
}
$('cfg-vista').addEventListener('click', async (e) => {
    const b = e.target.closest('[data-tema-cli]');
    if (!b) return;
    const t = b.dataset.temaCli;
    const nombre = (TEMAS_CLIENTE.find(x => x[0] === t) || [])[1] || t;
    try {
        await setDoc(doc(db, 'config', 'local'), { tema: t, actualizado: serverTimestamp() }, { merge: true });
        toast('🎨 Tema "' + nombre + '" activado: tus clientes lo ven al instante');
    } catch (err) {
        toast('No se pudo cambiar el tema: ' + (err.code === 'permission-denied' ? 'sin permiso (entrá como administrador).' : err.message));
    }
});

async function guardarHorario() {
    const horarios = {};
    for (let k = 0; k < 7; k++) {
        horarios[k] = (hdraft.horarios[k] || []).map(t => ({ a: t.a, c: t.c }));
        for (const t of horarios[k]) {
            if (!t.a || !t.c || t.a === t.c) { toast('Revisá ' + DIAS_N[k] + ': cada turno necesita hora de apertura y de cierre distintas.'); return; }
        }
    }
    if (hdraft.auto && !hayHorarios(horarios)) { toast('Activaste el modo automático pero no cargaste ningún turno.'); return; }
    try {
        await setDoc(doc(db, 'config', 'local'), { auto: !!hdraft.auto, horarios: horarios, mensaje: (hdraft.mensaje || '').trim().slice(0, 140), manual: null, manualHasta: null, actualizado: serverTimestamp() }, { merge: true });
        toast('✅ Horario guardado');
    } catch (e) { toast('No se pudo guardar: ' + (e.code === 'permission-denied' ? 'falta publicar las reglas nuevas (reglas_firestore.txt).' : e.message)); }
}
$('cfg-vista').addEventListener('input', (e) => {
    const t = e.target;
    if (!hdraft) return;
    if (t.dataset.hk) { const ts = hdraft.horarios[t.dataset.hd]; if (ts && ts[t.dataset.hi]) ts[t.dataset.hi][t.dataset.hk] = t.value; }
    else if (t.id === 'h-auto') hdraft.auto = t.checked;
    else if (t.id === 'h-msg') hdraft.mensaje = t.value;
});
$('cfg-vista').addEventListener('click', (e) => {
    const b = e.target.closest('button');
    if (!b) return;
    const d = b.dataset;
    if (d.hloc) { ponerLocalManual(d.hloc === 'auto' ? null : d.hloc); return; }
    if (!hdraft) return;
    if (d.hadd !== undefined) { (hdraft.horarios[d.hadd] = hdraft.horarios[d.hadd] || []).push({ a: '18:00', c: '23:30' }); vistaHorario(); }
    else if (d.hdel) { const [dd, i] = d.hdel.split('|'); hdraft.horarios[dd].splice(Number(i), 1); vistaHorario(); }
    else if (b.id === 'h-all') {
        const a = $('h-all-a').value, c = $('h-all-c').value;
        if (!a || !c || a === c) { toast('Poné una hora de apertura y otra de cierre distintas.'); return; }
        for (let k = 0; k < 7; k++) hdraft.horarios[k] = [{ a: a, c: c }];
        vistaHorario();
    }
    else if (b.id === 'h-guardar') guardarHorario();
});

// ===== Eventos =====
$('cfg-vista').addEventListener('input', (e) => {
    const t = e.target;
    if (t.dataset.p && draft) {
        const k = t.dataset.p.split('.'); let o = draft;
        for (let i = 0; i < k.length - 1; i++) o = o[k[i]];
        o[k[k.length - 1]] = t.dataset.n ? Math.max(0, Math.round(Number(t.value) || 0)) : t.value;
    } else if (t.id === 'inp-envios') {
        draft.envios = t.value.split(/[\s,;]+/).map(Number).filter(n => n > 0);
    } else if (t.id === 'cfc-bus') { bus = t.value; pintaClientes(); }
});
$('cfg-vista').addEventListener('click', (e) => {
    const b = e.target.closest('button');
    if (!b) return;
    const d = b.dataset;
    if (d.addSabor) {
        const v = $('add-' + d.addSabor).value.trim();
        if (!v) return;
        if (Object.values(draft.sabores).some(a => a.some(x => x.toLowerCase() === v.toLowerCase()))) { toast('Ese sabor ya existe.'); return; }
        draft.sabores[d.addSabor].push(v); vistaMenu(); $('add-' + d.addSabor).focus();
    } else if (d.delSabor) { const [c, i] = d.delSabor.split('|'); draft.sabores[c].splice(Number(i), 1); vistaMenu(); }
    else if (b.id === 'add-extra') { draft.extras.push({ id: 'x' + Date.now(), nombre: '', precio: 0 }); vistaMenu(); }
    else if (d.delExtra) { draft.extras.splice(Number(d.delExtra), 1); vistaMenu(); }
    else if (b.id === 'm-guardar') guardarMenu();
    else if (b.id === 'm-reset') { if (confirm('¿Volver a los precios y sabores originales? Se aplican recién al guardar.')) { draft = norm(DEF); vistaMenu(); } }
    else if (b.id === 'cfc-nuevo') { edCli = { id: null }; pintaForm(); }
    else if (d.cliEdit) { edCli = { id: d.cliEdit }; pintaForm(); }
    else if (b.id === 'cfc-cancelar') { edCli = null; pintaForm(); }
    else if (b.id === 'cfc-guardar') guardarCliente();
    else if (b.id === 'cfc-eliminar') {
        if (confirm('¿Eliminar este cliente de la memoria?\n\nSus pedidos anteriores no se borran.')) deleteDoc(doc(db, 'clientes', edCli.id)).then(() => { edCli = null; pintaForm(); toast('🗑️ Cliente eliminado'); }).catch(er => toast('No se pudo eliminar: ' + er.message));
    }
    else if (d.rango !== undefined) { rango = Number(d.rango); vistaReportes(); }
    else if (b.id === 'rep-csv') csvReporte();
    else if (b.id === 'd-backup') respaldo();
    else if (d.borrar) borrar(d.borrar);
    else if (d.delMesa) { const n = Number(d.delMesa); mesas = mesas.filter(x => x !== n); guardarMesas(); pintarMesas(); }
    else if (b.id === 'mesa-agregar') { const n = parseInt(($('mesa-nueva').value || '').trim(), 10); if (!n || mesas.includes(n)) { toast('La mesa ya existe.'); return; } mesas.push(n); guardarMesas(); pintarMesas(); }
});

        function abrirConfig() {
            if (esDelivery) return;
            $('modal-config').classList.remove('hidden');
            stops.forEach(f => f()); stops = [];
            stops.push(onSnapshot(doc(db, 'config', 'menu'), (s) => { if (!draft) { draft = norm(s.exists() ? s.data() : DEF); if (tab === 'menu') render(); } }, () => {}));
            stops.push(onSnapshot(query(collection(db, 'clientes'), orderBy('ultimo', 'desc'), limit(1000)), (s) => {
                clientes = s.docs.map(d => ({ id: d.id, ...d.data() }));
                if (tab === 'clientes') pintaClientes();
            }, () => {}));
            render();
        }
        function cerrarConfig() {
            $('modal-config').classList.add('hidden');
            stops.forEach(f => f()); stops = [];
            draft = null; cierres = null; edCli = null; hdraft = null;
        }
        $('btn-config').addEventListener('click', abrirConfig);
        $('cfg-cerrar').addEventListener('click', cerrarConfig);
        document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && !$('modal-config').classList.contains('hidden') && $('modal-nuevo').classList.contains('hidden')) cerrarConfig(); });
        })();

        setInterval(() => {
            document.querySelectorAll('[data-tiempo]').forEach(el => {
                const ms = Number(el.dataset.tiempo);
                el.textContent = '⏱ ' + hace(ms);
                el.className = 'inline-block text-xs font-bold px-2.5 py-1 rounded-lg ' + claseTiempo(ms);
            });
            actualizarAvisoSonido();
        }, 15000);
    </script>
